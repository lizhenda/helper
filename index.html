<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>习惯养成</title>
<style>
:root{
  --blue:#4A90D9;--blue-lt:#E8F2FC;--blue-dk:#3A7BC8;
  --bg:#F5F7FA;--card:#fff;--text:#333;--text-2:#888;
  --radius:12px;--shadow:0 2px 12px rgba(0,0,0,.08);
  --glass-bg:rgba(255,255,255,.92);--glass-bd:rgba(74,144,217,.2);
}
[data-mode="child"]{--accent:#FF6B9D;--accent-lt:#FFF0F5;--accent-dk:#E85585;
  --bg:#FFF8FB;--card:#fff;--radius:16px;--shadow:0 4px 16px rgba(255,107,157,.12)}
[data-mode="teen"]{--accent:#4A90D9;--accent-lt:#E8F2FC;--accent-dk:#3A7BC8}
[data-mode="simple"]{--accent:#5B6B7D;--accent-lt:#EEF1F4;--accent-dk:#4A5A6D;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);
  transition:background .3s;min-height:100vh}
/* layout */
.app{max-width:720px;margin:0 auto;padding:16px 16px 90px}
/* header */
.header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px}
.header h1{font-size:20px;color:var(--accent);font-weight:700}
.header .actions{display:flex;gap:8px;align-items:center}
.back-btn{display:flex;align-items:center;gap:4px;padding:8px 14px;border:none;border-radius:20px;
  background:var(--accent-lt);color:var(--accent);font-size:14px;font-weight:500;cursor:pointer}
.back-btn:active{opacity:.7}
/* progress ring */
.progress-section{display:flex;align-items:center;gap:16px;padding:16px;background:var(--card);
  border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.ring{position:relative;width:64px;height:64px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .bg-c{fill:none;stroke:var(--accent-lt);stroke-width:6}
.ring .fg-c{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .5s}
.ring .pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;font-weight:700;color:var(--accent)}
.progress-info{flex:1}
.progress-info .label{font-size:13px;color:var(--text-2);margin-bottom:4px}
.progress-info .streak{font-size:15px;font-weight:600}
.progress-info .streak .fire{color:#FF6B35}
/* stat cards */
.stat-row{display:flex;gap:10px;margin-bottom:16px}
.stat-card{flex:1;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 10px;text-align:center}
.stat-card .num{font-size:22px;font-weight:700;color:var(--accent)}
.stat-card .lbl{font-size:11px;color:var(--text-2);margin-top:4px}
/* habit list */
.section-title{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.section-title .add-link{font-size:13px;color:var(--accent);cursor:pointer;font-weight:400}
.habit-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);
  border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;
  transition:all .2s;border:2px solid transparent}
.habit-item:active{transform:scale(.98)}
.habit-item.done{opacity:.6}
.habit-item.done .habit-name{text-decoration:line-through}
.habit-item.locked{opacity:.65;background:#f7f8fa}
.habit-item.locked .habit-name{color:var(--text-2)}
.habit-lock{display:block;font-size:11px;color:#b0a0a0;font-weight:600;margin-top:4px}
.habit-item.locked .habit-check{border-color:#ccc;color:#999}
.habit-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:22px;flex-shrink:0;background:var(--accent-lt)}
.habit-body{flex:1;min-width:0}
.habit-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habit-meta{font-size:12px;color:var(--text-2);margin-top:3px;display:flex;gap:8px;align-items:center}
.habit-meta .pts{color:var(--accent);font-weight:600}
.habit-meta .pts.punish{color:#e74c3c;font-weight:700}
.habit-meta .pts .punish-tip{font-size:10px;color:#e74c3c;opacity:.8;font-weight:400}
.pts-punish-lbl{font-size:11px;color:#e74c3c;font-weight:500}
.habit-item.punish-item .habit-check{border-color:#e74c3c}
.habit-item.punish-item.done .habit-check{background:#e74c3c;color:#fff;border-color:#e74c3c}
.habit-item.punish-item.done{opacity:1}
.habit-item.punish-item.done .habit-name{text-decoration:line-through;color:var(--text-2)}
.habit-goal{display:block;font-size:11px;color:var(--accent);font-weight:600;margin-top:4px}
.habit-goal .g-bar{display:block;height:4px;background:var(--accent-lt);border-radius:2px;margin-top:4px;overflow:hidden}
.habit-goal .g-bar .g-fill{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.habit-check{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--accent);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .3s}
.habit-item.done .habit-check{background:var(--accent);color:#fff}
.habit-check .ck{font-size:16px;opacity:0;transition:opacity .2s}
.mini-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);
  background:var(--accent-lt);color:var(--accent);font-size:17px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  padding:0;font-family:inherit;transition:all .2s}
.mini-btn:active:not(:disabled){transform:scale(.88);background:var(--accent);color:#fff}
.mini-btn:disabled{border-color:#ccc;color:#aaa;background:#f2f2f2;cursor:not-allowed}
.mini-btn.minus:disabled{opacity:.6}
.habit-item.done .habit-check .ck{opacity:1}
[data-mode="child"] .habit-item{padding:16px}
[data-mode="child"] .habit-icon{width:56px;height:56px;font-size:30px;border-radius:16px}
[data-mode="child"] .habit-name{font-size:18px}
[data-mode="child"] .habit-check{width:36px;height:36px}
[data-mode="child"] .habit-check .ck{font-size:22px}
/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);
  box-shadow:0 -2px 12px rgba(0,0,0,.06);z-index:100;max-width:720px;margin:0 auto}
.tab{flex:1;padding:12px 0;text-align:center;cursor:pointer;color:var(--text-2);transition:color .2s;border:none;background:none}
.tab .tab-ic{font-size:24px;display:block}
.tab .tab-lb{font-size:11px;display:block;margin-top:3px;font-weight:500}
.tab.active{color:var(--accent)}
[data-mode="child"] .tab .tab-lb{font-size:12px}
[data-mode="child"] .tab .tab-ic{font-size:28px}
/* mine: profile */
.mine-profile{display:flex;align-items:center;gap:14px;padding:18px;background:var(--card);
  border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.mine-avatar{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:36px;flex-shrink:0;overflow:hidden}
.mine-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.user-chip img,.mc-avatar img{width:100%;height:100%;object-fit:cover;display:block}
/* 点击头像放大预览：可点击态 */
.avatar-viewable{position:relative;display:flex;align-items:center;justify-content:center;
  overflow:visible;cursor:zoom-in;transition:transform .2s}
.avatar-viewable:active{transform:scale(.92)}
.avatar-viewable img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
/* 头像全屏预览：尽量铺满屏幕，点击任意处关闭 */
.av-viewer{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.95);z-index:300;
  display:none;align-items:center;justify-content:center;cursor:zoom-out}
.av-viewer.show{display:flex}
.av-viewer .photo{width:100vw;height:100vh;object-fit:contain;display:block;animation:avPop .25s}
.av-viewer .emoji-photo{font-size:min(55vw,55vh,480px);line-height:1;user-select:none;animation:avPop .25s}
@keyframes avPop{from{transform:scale(.88);opacity:.4}to{transform:scale(1);opacity:1}}
.av-viewer .av-name{position:absolute;bottom:40px;left:0;right:0;text-align:center;color:rgba(255,255,255,.92);
  font-size:17px;font-weight:600;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.av-viewer .av-close{position:absolute;top:14px;right:18px;color:rgba(255,255,255,.9);font-size:32px;
  background:none;border:none;cursor:pointer;padding:6px 10px;line-height:1}
.av-viewer .av-tip{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.4);
  font-size:11px;pointer-events:none}
.mine-info{flex:1;min-width:0}
.mine-name{font-size:18px;font-weight:700;color:var(--accent)}
.mine-meta{font-size:12px;color:var(--text-2);margin-top:4px}
.mine-points{font-size:22px;font-weight:700;color:var(--accent);flex-shrink:0}
.mine-points .lbl{display:block;font-size:11px;color:var(--text-2);font-weight:400;text-align:center}
.switch-user-btn{flex-shrink:0;padding:8px 14px;border:none;border-radius:20px;background:var(--accent-lt);
  color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.switch-user-btn:active{opacity:.7}
[data-mode="child"] .mine-avatar{width:76px;height:76px;font-size:44px}
[data-mode="child"] .mine-name{font-size:20px}
/* mine: member switch grid */
.member-grid{display:flex;gap:10px;overflow-x:auto;padding:2px 0 14px;-ms-overflow-style:none;scrollbar-width:none}
.member-grid::-webkit-scrollbar{display:none}
.member-card{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 18px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);
  cursor:pointer;border:2.5px solid transparent;transition:all .2s;min-width:84px}
.member-card.active{border-color:var(--accent);background:var(--accent-lt)}
.member-card .mc-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:26px;overflow:hidden}
.member-card .mc-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.member-card .mc-name{font-size:13px;font-weight:500}
.member-card .mc-pts{font-size:11px;color:var(--text-2)}
.member-card.add{border-style:dashed;border-color:#ccc;background:transparent;box-shadow:none}
.member-card.add .mc-add{font-size:28px;color:var(--accent);width:48px;height:48px;display:flex;align-items:center;justify-content:center}
[data-mode="child"] .member-card .mc-avatar{width:58px;height:58px;font-size:32px}
/* mine: menu list */
.menu-list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.menu-item{display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer;transition:background .15s;
  border-bottom:1px solid #f2f2f2}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:var(--accent-lt)}
.menu-item .m-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:22px;flex-shrink:0;background:var(--accent-lt)}
.menu-item .m-body{flex:1}
.menu-item .m-name{font-size:15px;font-weight:500}
.menu-item .m-desc{font-size:11px;color:var(--text-2);margin-top:2px}
.menu-item .m-arrow{font-size:20px;color:var(--text-2);flex-shrink:0}
[data-mode="child"] .menu-item{padding:18px}
[data-mode="child"] .menu-item .m-ic{width:50px;height:50px;font-size:28px}
[data-mode="child"] .menu-item .m-name{font-size:17px}
/* history log */
.log-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);
  border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:8px}
.log-item .l-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0;background:var(--accent-lt)}
.log-item .l-body{flex:1;min-width:0}
.log-item .l-title{font-size:14px;font-weight:500}
.log-item .l-time{font-size:11px;color:var(--text-2);margin-top:2px}
.log-item .l-pts{font-size:16px;font-weight:700;flex-shrink:0}
.log-item .l-pts.plus{color:#4CAF50}
.log-item .l-pts.minus{color:#F44336}
[data-mode="child"] .log-item{padding:14px}
[data-mode="child"] .log-item .l-ic{width:44px;height:44px;font-size:24px}
[data-mode="child"] .log-item .l-title{font-size:16px}
/* reward & badge grid */
.reward-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.reward-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px 12px;text-align:center;cursor:pointer;transition:all .2s;border:2px solid transparent}
.reward-card:active{transform:scale(.96)}
.reward-card .r-ic{font-size:36px;margin-bottom:8px}
.reward-card .r-nm{font-size:14px;font-weight:500;margin-bottom:6px}
.reward-card .r-pts{font-size:13px;color:var(--accent);font-weight:600}
.reward-card.disabled{opacity:.45;cursor:not-allowed}
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badge-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 8px;text-align:center}
.badge-card.locked{opacity:.4;filter:grayscale(.6)}
.badge-card .b-ic{font-size:34px;margin-bottom:6px}
.badge-card .b-nm{font-size:12px;font-weight:500}
.badge-card .b-desc{font-size:10px;color:var(--text-2);margin-top:4px}
/* admin view */
.compare-chart{display:flex;gap:12px;margin-bottom:16px}
.compare-col{flex:1;text-align:center}
.compare-bar{height:100px;background:var(--accent-lt);border-radius:8px;position:relative;
  overflow:hidden;display:flex;align-items:flex-end;margin-bottom:8px}
.compare-bar .fill{width:100%;background:var(--accent);border-radius:8px;transition:height .5s}
.compare-col .nm{font-size:12px;color:var(--text-2)}
.compare-col .pct{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px}
.approval-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);
  border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px}
.approval-item .a-ic{font-size:28px}
.approval-item .a-body{flex:1}
.approval-item .a-nm{font-size:14px;font-weight:500}
.approval-item .a-meta{font-size:12px;color:var(--text-2);margin-top:2px}
.approval-item .a-btns{display:flex;gap:8px}
.a-btn{padding:6px 14px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500}
.a-btn.approve{background:var(--accent);color:#fff}
.a-btn.reject{background:#eee;color:#666}
.empty{text-align:center;padding:40px 20px;color:var(--text-2)}
.empty .em-ic{font-size:48px;margin-bottom:12px;opacity:.4}
/* modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);
  backdrop-filter:blur(4px);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--glass-bg);border:1px solid var(--glass-bd);border-radius:20px 20px 0 0;
  width:100%;max-width:720px;max-height:85vh;overflow-y:auto;padding:20px;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:18px;margin-bottom:16px;color:var(--accent)}
.modal .close-btn{position:absolute;top:16px;right:20px;font-size:24px;cursor:pointer;color:var(--text-2);background:none;border:none}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:15px;
  background:#fff;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);outline:none}
.color-presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.color-presets .cp{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;
  transition:all .15s;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.color-presets .cp:hover{transform:scale(1.12)}
.color-presets .cp.sel{border-color:#333;transform:scale(1.1)}
.color-custom{display:flex;align-items:center;gap:10px}
.color-custom input[type="color"]{width:44px;height:34px;border:none;border-radius:8px;cursor:pointer;padding:2px;background:#f0f0f0}
.color-custom .cc-lbl{font-size:12px;color:var(--text-2)}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
.btn-primary{width:100%;padding:14px;border:none;border-radius:10px;background:var(--accent);
  color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn-primary:active{opacity:.8}
.btn-danger{width:100%;padding:12px;border:none;border-radius:10px;background:#fee;color:#c33;
  font-size:14px;font-weight:500;cursor:pointer;margin-top:10px}
/* toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
  background:rgba(0,0,0,.75);color:#fff;padding:16px 24px;border-radius:16px;font-size:16px;
  z-index:300;transition:transform .3s;pointer-events:none;text-align:center}
.toast.show{transform:translate(-50%,-50%) scale(1)}
.toast .t-ic{font-size:40px;display:block;margin-bottom:8px}
/* celebration overlay */
.celebrate{position:fixed;top:0;left:0;right:0;bottom:0;z-index:250;pointer-events:none;
  display:none;align-items:center;justify-content:center}
.celebrate.show{display:flex}
.celebrate .emoji{position:absolute;font-size:28px;animation:pop .8s ease-out forwards}
@keyframes pop{0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-300px) scale(.3)}}
.celebrate .center-star{font-size:80px;animation:starPulse .6s ease-out}
@keyframes starPulse{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.3) rotate(10deg)}
  100%{transform:scale(1) rotate(0)}}
.hidden{display:none!important}
/* storage banner */
.storage-banner{display:none;background:#FFF4E0;border:1px solid #FFD28A;color:#9A6A00;
  padding:12px 14px;border-radius:var(--radius);margin-bottom:14px;font-size:13px;line-height:1.6}
.storage-banner .sb-t{font-weight:700;margin-bottom:4px}
</style>
</head>
<body>
<div class="app" id="app">

<!-- Storage Warning Banner -->
<div class="storage-banner" id="storageBanner">
  <div class="sb-t">⚠️ 浏览器无法保存数据</div>
  当前浏览器禁用了本地存储（localStorage），打卡与积分等记录仅本次浏览有效，刷新或关闭页面后会丢失。请检查浏览器隐私设置，或改用 Chrome / Edge 等支持本地存储的浏览器。
</div>

<!-- Header -->
<div class="header">
  <h1 id="pageTitle">习惯养成</h1>
  <div class="actions" id="headerActions"></div>
</div>

<!-- Main Content -->
<div id="mainContent"></div>

</div>

<!-- Bottom Tabs -->
<div class="tabs" id="bottomTabs">
  <button class="tab active" data-tab="habits" onclick="switchTab('habits')">
    <span class="tab-ic">📋</span><span class="tab-lb">打卡</span>
  </button>
  <button class="tab" data-tab="mine" onclick="switchTab('mine')">
    <span class="tab-ic">👤</span><span class="tab-lb">我的</span>
  </button>
</div>

<!-- Modal Container -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- Avatar Fullscreen Viewer -->
<div class="av-viewer" id="avatarViewer" onclick="closeAvatarViewer()"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Celebration -->
<div class="celebrate" id="celebrate"></div>

<script>
// ======================== Data Layer ========================
const STORAGE_KEY='habit_tracker_v1';
let state={members:[],currentMemberId:null,currentTab:'habits',mineView:'main',adminUnlocked:false,adminPwd:'1234',habitTemplates:[]};
let cachedData=null;
// 存储兼容性状态：storageOK 表示 localStorage 可用；storageMode='local'|'memory'
let storageOK=true,storageMode='local',storageNote='';

// ---------- 浏览器存储兼容性检测 ----------
// 检测 localStorage 是否真正可用（隐私模式/禁用存储时访问会抛异常）
function testLocalStorage(){
  try{
    const k='__habit_test__';
    window.localStorage.setItem(k,'1');
    const v=window.localStorage.getItem(k);
    window.localStorage.removeItem(k);
    if(v!=='1')throw new Error('readback failed');
    return true;
  }catch(e){return false;}
}
// 估算已用存储量（字节），不可用时返回 0
function calcStorageUsed(){
  try{
    let bytes=0;
    for(let i=0;i<window.localStorage.length;i++){
      const k=window.localStorage.key(i);
      if(!k)continue;
      const v=window.localStorage.getItem(k)||'';
      bytes+=(k.length+v.length)*2; // UTF-16 约 2 字节/字符
    }
    return bytes;
  }catch(e){return 0;}
}
// 检测浏览器兼容性，结果写入全局；返回对象
let storageDetected=false;
function detectStorage(){
  const info={ok:true,mode:'local',note:'',used:0};
  if(storageDetected){
    // 快速返回缓存结果（但仍实时计算占用）
    info.ok=storageOK;info.mode=storageMode;info.note=storageNote;
    if(storageOK){try{info.bytes=calcStorageUsed();}catch(e){info.bytes=0;}}
    return info;
  }
  storageDetected=true;
  try{
    if(typeof window.localStorage==='undefined'){
      info.ok=false;info.note='当前浏览器不支持 localStorage';
    }else if(!testLocalStorage()){
      info.ok=false;info.note='浏览器禁用了本地存储（可能处于隐私模式或站点数据被禁用）';
    }else{
      info.ok=true;info.note='';
      try{info.bytes=calcStorageUsed();}catch(e){info.bytes=0;}
    }
  }catch(e){
    // 访问 localStorage 本身抛异常（如隐私模式）
    info.ok=false;info.note='浏览器禁用了本地存储（可能处于隐私模式或站点数据被禁用）';
  }
  storageOK=info.ok;
  storageMode=info.ok?'local':'memory';
  storageNote=info.note;
  return info;
}

// 统一的存储读写：localStorage 不可用时降级为内存（本次会话内可用）
function storageGet(k){
  if(storageOK){try{return window.localStorage.getItem(k);}catch(e){}}
  return (window.__memStore&&window.__memStore[k])||null;
}
function storageSet(k,v){
  if(storageOK){try{window.localStorage.setItem(k,v);return;}catch(e){}}
  if(!window.__memStore)window.__memStore={};
  window.__memStore[k]=v;
}
function storageRemove(k){
  if(storageOK){try{window.localStorage.removeItem(k);return;}catch(e){}}
  if(window.__memStore)delete window.__memStore[k];
}

// 每日打开页面时，结算「昨天」未打卡的惩罚任务（负分任务）：没做到即扣分，扣到 0 为止
function settlePunishments(){
  if(!state||!state.members)return;
  const yesterday=dateStrOffset(-1);
  let changed=false;
  state.members.forEach(m=>{
    const settled=(m._punishSettled)||{};
    if(settled[yesterday])return; // 昨天已结算过，防止重复扣
    const ci=m.checkins[yesterday]||{};
    m.habits.forEach(h=>{
      if(h.points>=0)return;          // 仅处理惩罚任务（负分）
      if(!h.active)return;
      if(!isHabitToday(h,yesterdayDow()))return; // 昨天不是执行日不扣
      if(ci[h.id])return;             // 昨天已打卡（做到了）不扣
      const cur=m.points;
      const amount=Math.min(Math.abs(h.points),cur); // 扣到 0 为止
      if(amount<=0){m.points=0;return}
      m.points-=amount;
      logPoints(m,-amount,'未做到：'+h.name,h.icon);
      changed=true;
    });
    settled[yesterday]=true;
    m._punishSettled=settled;
  });
  if(changed)saveData();
}
// 计算相对今天偏移 offset 天的日期字符串（offset=-1 为昨天）
function dateStrOffset(offset){
  const d=new Date();
  d.setDate(d.getDate()+offset);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// 混合两种 hex 颜色：ratio 为 mix 色占比（0~1）
function mixColor(hex,mixHex,ratio){
  const h=hex.replace('#',''),mh=mixHex.replace('#','');
  const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  const mr=parseInt(mh.substr(0,2),16),mg=parseInt(mh.substr(2,2),16),mb=parseInt(mh.substr(4,2),16);
  const R=Math.round(r*(1-ratio)+mr*ratio),G=Math.round(g*(1-ratio)+mg*ratio),B=Math.round(b*(1-ratio)+mb*ratio);
  return '#'+[R,G,B].map(v=>v.toString(16).padStart(2,'0')).join('');
}
// hex 颜色转 rgba 字符串
function hexToRgba(hex,a){
  const h=hex.replace('#','');
  const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  return `rgba(${r},${g},${b},${a})`;
}

// 判断某习惯今日是否被前置任务锁定（前置未完成）
function isLockedHabit(m,h){
  if(!h.prereq)return false;
  const pre=findHabit(m,h.prereq);
  if(!pre)return false;
  return !isHabitDone(m,pre,todayStr());
}
function findHabit(m,id){
  return (m&&m.habits)?m.habits.find(x=>x.id===id):null;
}

// ======================== Logic ========================
function isHabitToday(h,dow){
  if(h.freq==='once')return true;
  if(h.freq==='daily')return h.days?h.days.includes(dow):true;
  return true;
}
// 获取某天某习惯的打卡次数（兼容旧数据 true=1次）
function getCheckinCount(m,day,habitId){
  const ci=m.checkins[day];
  if(!ci)return 0;
  const v=ci[habitId];
  if(v===true)return 1;
  return v||0;
}
// 判断某天某习惯是否已完成（打卡次数≥目标次数）
function isHabitDone(m,h,day){
  const target=h.targetTimes||1;
  return getCheckinCount(m,day,h.id)>=target;
}
function countHabitDays(m,h){
  let cnt=0;
  for(const ds in m.checkins){
    if(getCheckinCount(m,ds,h.id)>0)cnt++;
  }
  return cnt;
}
// 单次任务（targetTimes=1）点击切换：完成则撤销，未完成则打卡；多次任务由 ± 按钮调用 adjustCheckin
function toggleCheckin(habitId){
  const m=getMember();if(!m)return;
  const h=m.habits.find(x=>x.id===habitId);if(!h)return;
  const target=h.targetTimes||1;
  const cur=getCheckinCount(m,todayStr(),habitId);
  adjustCheckin(habitId,cur>=target?-1:1);
}
// 多次打卡核心：delta=1 打卡一次 / delta=-1 撤销一次
function adjustCheckin(habitId,delta){
  const m=getMember();if(!m)return;
  const today=todayStr();
  if(!m.checkins[today])m.checkins[today]={};
  const h=m.habits.find(x=>x.id===habitId);if(!h)return;
  const target=h.targetTimes||1;
  const cur=getCheckinCount(m,today,habitId);
  const done=cur>=target;
  const mode=m.mode;
  if(delta>0){
    // ===== 打卡一次 =====
    if(cur>=target){showToast('今天已完成全部次数','✅');return}
    if(isLockedHabit(m,h)){
      const pre=findHabit(m,h.prereq);
      showToast('先完成「'+(pre?pre.name:'前置任务')+'」','🔒');
      if(mode==='child')speak('先完成'+(pre?pre.name:'前置任务')+'，再来完成'+h.name);
      return;
    }
    // 惩罚任务：打卡=做到了，不扣分；撤销不退
    if(h.points<0){
      m.checkins[today][habitId]=cur+1;
      logPoints(m,0,'做到：'+h.name+'（未扣分）',h.icon);
      showToast('做到了！没扣分','✅');
      if(mode==='child')speak('太棒了，你做到了'+h.name);
      saveData();render();
      return;
    }
    m.points+=h.points;
    logPoints(m,h.points,target>1?'完成一次：'+h.name:'完成习惯：'+h.name,h.icon);
    m.checkins[today][habitId]=cur+1;
    const newCnt=cur+1;
    const msgs=['太棒了！','做得真好！','继续保持！','你真厉害！','又完成一个！'];
    const msg=msgs[Math.floor(Math.random()*msgs.length)];
    if(newCnt>=target){
      showToast(msg,h.icon);
      if(mode==='child')speak(msg+'你完成了'+h.name);
      celebrate();
      if(h.goalDays&&countHabitDays(m,h)>=h.goalDays){
        showToast('🎉 达成目标：'+h.name+' '+h.goalDays+'天！','🏆');
        if(mode==='child')speak('太棒了，你完成了'+h.name+' '+h.goalDays+'天的挑战');
        celebrate();
      }
      checkBadges(m);
    }else{
      showToast(msg+'（'+newCnt+'/'+target+'）',h.icon);
      if(mode==='child')speak(msg);
    }
  }else{
    // ===== 撤销一次 =====
    if(cur<=0)return;
    // 级联判断：此次撤销将使任务失去「已完成」状态时（cur 达标后撤销一次），下游已完成任务需一并取消，
    // 防止出现「前置未完成但下游已完成」的矛盾（含 cur=1 清零场景）
    const willLoseDone=cur>=target;
    if(willLoseDone){
      const cascade=collectCascadeDownstream(m,h,today);
      if(cascade.length>0){
        const refund=(h.points>=0?cur*h.points:0)+cascade.reduce((s,x)=>{const xc=getCheckinCount(m,today,x.id);return s+(x.points>=0?xc*x.points:0)},0);
        openModal(`<h3>取消打卡</h3>
        <button class="close-btn" onclick="closeModal()">×</button>
        <p style="font-size:14px;color:var(--text-1);margin-bottom:8px">将取消「${h.name}」的打卡。</p>
        <p style="font-size:13px;color:var(--text-2);margin-bottom:4px">以下任务以它为前置且今日已完成，将一并取消：</p>
        <p style="font-size:13px;font-weight:600;color:var(--accent);margin-bottom:14px">${cascade.map(x=>x.icon+' '+x.name).join('、')}</p>
        <button class="btn-primary" onclick="doCascadeCancel('${h.id}')">确认取消（共退回 ${refund} 分）</button>
        <button class="btn-danger" onclick="closeModal()">不取消了</button>
      `);
        return;
      }
    }
    if(h.points<0){
      // 惩罚任务：撤销“做到了”，积分不变（打卡时本就没扣）
      if(cur<=1){delete m.checkins[today][habitId]}else{m.checkins[today][habitId]=cur-1}
      logPoints(m,0,'取消做到：'+h.name,h.icon);
      showToast('已取消','↩️');
      saveData();render();
      return;
    }
    m.points-=h.points;
    logPoints(m,-h.points,target>1?'取消一次：'+h.name:'取消打卡：'+h.name,h.icon);
    if(cur<=1){delete m.checkins[today][habitId]}else{m.checkins[today][habitId]=cur-1}
    showToast(target>1?'已取消一次':'已取消','↩️');
  }
  saveData();render();
}
// 收集今日已完成、且直接/间接以指定任务为前置的任务（级联取消范围）
function collectCascadeDownstream(m,h,today){
  const result=[];
  const direct=m.habits.filter(x=>x.prereq===h.id&&isHabitDone(m,x,today));
  direct.forEach(x=>{
    if(!result.find(r=>r.id===x.id)){
      result.push(x);
      collectCascadeDownstream(m,x,today).forEach(y=>{
        if(!result.find(r=>r.id===y.id))result.push(y);
      });
    }
  });
  return result;
}
// 确认后执行级联取消（沿依赖链逐一取消并退回积分）
function doCascadeCancel(habitId){
  const m=getMember();if(!m)return;
  const today=todayStr();
  const h=m.habits.find(x=>x.id===habitId);if(!h)return;
  const cascade=collectCascadeDownstream(m,h,today);
  cascade.forEach(x=>{
    const xc=getCheckinCount(m,today,x.id);
    if(x.points>=0&&xc>0){m.points-=xc*x.points;logPoints(m,-xc*x.points,'级联取消：'+x.name,x.icon)}
    delete m.checkins[today][x.id];
  });
  const cnt=getCheckinCount(m,today,habitId);
  if(h.points>=0&&cnt>0){m.points-=cnt*h.points;logPoints(m,-cnt*h.points,'取消打卡：'+h.name,h.icon)}
  delete m.checkins[today][habitId];
  saveData();closeModal();render();
  showToast('已取消（含前置链下游 '+(cascade.length+1)+' 项）','↩️');
}
function calcStreak(m){
  let streak=0;const d=new Date();
  while(true){
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const ci=m.checkins[ds];
    if(ci&&Object.keys(ci).length>0)streak++;
    else break;
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function checkBadges(m){
  const streak=calcStreak(m);
  const defs=state.badgeDefs||[];
  defs.forEach(b=>{
    if(streak>=b.days&&!m.badges.includes(b.id)){
      m.badges.push(b.id);
      showToast('解锁徽章：'+b.name,b.icon);
      if(m.mode==='child')speak('太棒了，你获得了'+b.name+'徽章');
      celebrate();
    }
  });
}
function requestReward(rewardId){
  const m=getMember();if(!m)return;
  const r=(state.rewardTemplates||[]).find(t=>t.id===rewardId);if(!r)return;
  if(m.points<r.points){showToast('积分不足','😢');return}
  if(!m.pendingRewards)m.pendingRewards=[];
  m.pendingRewards.push({id:uid(),rewardId,date:todayStr()});
  m.points-=r.points;
  logPoints(m,-r.points,'兑换奖励：'+r.name,r.icon);
  showToast('已申请，等待审批','📨');
  if(m.mode==='child')speak('你申请了'+r.name+'，等爸爸妈妈同意哦');
  saveData();render();
}
function approveReward(memberId,prId){
  const m=state.members.find(x=>x.id===memberId);if(!m)return;
  m.pendingRewards=m.pendingRewards.filter(p=>p.id!==prId);
  if(!m.rewards)m.rewards=[];

}
function rejectReward(memberId,prId){

  const pr=m.pendingRewards.find(p=>p.id===prId);
  const r=pr?(state.rewardTemplates||[]).find(t=>t.id===pr.rewardId):null;
  m.pendingRewards=m.pendingRewards.filter(p=>p.id!==prId);
  if(r){m.points+=r.points;logPoints(m,r.points,'奖励驳回退回：'+r.name,r.icon)}

function compressAvatar(file,cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      // 超大图安全处理：单边 > 4096 时分步减半降采样（移动端 canvas 尺寸限制约 4096，直接解码大图可能失败）
      let src=img,sw=img.width,sh=img.height;
      while(Math.max(sw,sh)>4096){
        const step=document.createElement('canvas');
        step.width=Math.max(1,Math.round(sw/2));
        step.height=Math.max(1,Math.round(sh/2));
        step.getContext('2d').drawImage(src,0,0,step.width,step.height);
        src=step;sw=step.width;sh=step.height;
      }
      const MAX=768; // 高清头像：手机全屏查看几乎 1:1，桌面轻微放大，存储约 40~120KB/张
      const scale=Math.min(1,MAX/Math.max(sw,sh));
      const w=Math.max(1,Math.round(sw*scale)),h=Math.max(1,Math.round(sh*scale));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(src,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.85));
    };
    img.onerror=()=>showToast('图片读取失败','❌');
    img.src=e.target.result;
  };
  reader.onerror=()=>showToast('图片读取失败','❌');
  reader.readAsDataURL(file);
}

function saveHabit(memberId,id){
  const m=memberId?state.members.find(x=>x.id===memberId):getMember();if(!m)return;
  const name=document.getElementById('hName').value.trim();
  if(!name){showToast('请输入名称','❌');return}
  const icon=document.getElementById('hIcon').value;
  const points=parseInt(document.getElementById('hPoints').value)||0;
  const freq=document.getElementById('hFreq').value;
  const goalRaw=document.getElementById('hGoal').value;
  const goalDays=goalRaw?parseInt(goalRaw)||0:0;
  const timesRaw=document.getElementById('hTimes').value;
  const targetTimes=Math.max(1,parseInt(timesRaw)||1);
  const finalTarget=points<0?1:targetTimes;
  const prereq=document.getElementById('hPrereq').value||'';
  const days=[];
  document.querySelectorAll('[data-day]').forEach(cb=>{if(cb.checked)days.push(parseInt(cb.dataset.day))});
  // 校验：惩罚任务（负分）不能设置前置任务
  if(points<0&&prereq){showToast('惩罚任务不能设置前置任务','❌');return}
  // 校验：惩罚任务（负分）不能被其他任务设为前置
  if(points<0&&id){
    const dependents=m.habits.filter(x=>x.prereq===id);
    if(dependents.length>0){
      showToast('已有任务以它为前置，不能改为惩罚任务','❌');return;
    }
  }
  // 校验：前置任务不能造成循环依赖（A→B→A）；仅编辑已有习惯时需要校验（新增无循环可能）
  if(prereq&&id){
    let cur=prereq;
    while(cur&&cur!==id){
      const ph=findHabit(m,cur);
      cur=ph?ph.prereq:'';
    }
    if(cur===id){showToast('前置任务不能形成循环','❌');return}
  }
  if(id){
    const h=m.habits.find(x=>x.id===id);
    Object.assign(h,{name,icon,points,freq,days,goalDays:goalDays||0,targetTimes:finalTarget,prereq});
  }else{
    m.habits.push({id:uid(),name,icon,points,freq,days,goalDays:goalDays||0,targetTimes:finalTarget,prereq,active:true});
  }
  saveData();closeModal();render();
}
function deleteHabit(memberId,id){
  const m=memberId?state.members.find(x=>x.id===memberId):getMember();if(!m)return;
  m.habits=m.habits.filter(h=>h.id!==id);
  // 清理其他习惯对该习惯的前置引用
  m.habits.forEach(h=>{if(h.prereq===id)h.prereq=''});
  saveData();closeModal();render();
}
function applyHabitTemplate(m){

    m.habits=[
      {id:uid(),name:'自己刷牙',icon:'🪥',points:2,freq:'daily',days:[1,2,3,4,5,6,7],active:true},
      {id:uid(),name:'自己穿衣',icon:'👕',points:2,freq:'daily',days:[1,2,3,4,5,6,7],active:true},

// ======================== Task Template Library ========================
function openTemplateEditor(id){
  const t=id?state.habitTemplates.find(x=>x.id===id):null;
  const icons=['📚','✏️','✍️','📖','🎒','🪥','👕','🧸','🤸','😴','💧','🥗','🏃','🧹','🎹','🎨','🙏','⏰','⚫','♟️'];
  let iconOpts=icons.map(i=>`<option value="${i}" ${t&&t.icon===i?'selected':''}>${i} ${i}</option>`).join('');
  let dayCk=[1,2,3,4,5,6,7].map(d=>{
    const labels=['','一','二','三','四','五','六','日'];
    const ck=t&&t.days?t.days.includes(d):true;
    return `<label style="display:inline-block;margin:4px"><input type="checkbox" data-tday="${d}" ${ck?'checked':''}> ${labels[d]}</label>`;
  }).join('');
  openModal(`<h3>${t?'编辑模板':'新增模板'}</h3>
    <button class="close-btn" onclick="closeModal()">×</button>
    <div class="form-group"><label>任务名称</label>
      <input type="text" id="tName" value="${t?t.name:''}" placeholder="如：每天阅读20分钟"></div>
    <div class="form-row">
      <div class="form-group"><label>图标</label><select id="tIcon">${iconOpts}</select></div>
      <div class="form-group"><label>积分</label>
        <input type="number" id="tPoints" value="${t?t.points:2}" min="-20" max="10" step="1" oninput="syncTemplateTimes()">
        <div style="font-size:11px;color:var(--text-2);margin-top:4px">负数为惩罚任务（如 -2），未完成自动扣分</div></div>
    </div>
    <div class="form-group"><label>频率</label><select id="tFreq">
      <option value="daily" ${(!t||t.freq==='daily')?'selected':''}>每日</option>
      <option value="once" ${t&&t.freq==='once'?'selected':''}>一次性</option>
    </select></div>
    <div class="form-group"><label>执行日期</label><div>${dayCk}</div></div>
    <div class="form-group"><label>每日目标次数（默认 1，如每天喝 3 次水填 3）</label>
      <input type="number" id="tTimes" value="${t&&t.targetTimes?t.targetTimes:1}" min="1" max="20" step="1" ${t&&t.points<0?'disabled':''}>
      <div style="font-size:11px;color:var(--text-2);margin-top:4px" id="tTimesHint">${t&&t.points<0?'惩罚任务固定为 1 次':'大于 1 时每天需打卡多次，每次得分'}</div></div>
    <div class="form-group"><label>目标天数（选填，如 100 天挑战）</label>
      <input type="number" id="tGoal" value="${t&&t.goalDays?t.goalDays:''}" min="0" max="3650" placeholder="不填则无目标">
      <div style="font-size:11px;color:var(--text-2);margin-top:4px">设置后每天打卡会显示进度，如「第 5 / 100 天」</div></div>
    <button class="btn-primary" onclick="saveTemplate('${t?t.id:''}')">保存</button>
    ${t?`<button class="btn-danger" onclick="deleteTemplate('${t.id}')">删除模板</button>`:''}
  `);
}
function saveTemplate(id){
  const name=document.getElementById('tName').value.trim();
  if(!name){showToast('请输入名称','❌');return}
  const icon=document.getElementById('tIcon').value;
  const points=parseInt(document.getElementById('tPoints').value)||0;
  const freq=document.getElementById('tFreq').value;
  const goalRaw=document.getElementById('tGoal').value;
  const goalDays=goalRaw?parseInt(goalRaw)||0:0;
  const timesRaw=document.getElementById('tTimes').value;
  const targetTimes=Math.max(1,parseInt(timesRaw)||1);
  const finalTarget=points<0?1:targetTimes;
  const days=[];
  document.querySelectorAll('[data-tday]').forEach(cb=>{if(cb.checked)days.push(parseInt(cb.dataset.tday))});
  if(id){
    const t=state.habitTemplates.find(x=>x.id===id);
    Object.assign(t,{name,icon,points,freq,days,goalDays,targetTimes:finalTarget});
  }else{
    state.habitTemplates.push({id:uid(),name,icon,points,freq,days,goalDays,targetTimes:finalTarget});
  }
  saveData();closeModal();render();
}
function deleteTemplate(id){
  state.habitTemplates=state.habitTemplates.filter(t=>t.id!==id);
  saveData();closeModal();render();
}
// 模板积分输入变化时：负分（惩罚）任务禁用次数输入
function syncTemplateTimes(){
  const inp=document.getElementById('tPoints');
  const timesInp=document.getElementById('tTimes');
  const hint=document.getElementById('tTimesHint');
  if(!inp||!timesInp)return;
  const punish=parseInt(inp.value)<0;
  timesInp.disabled=punish;
  if(punish)timesInp.value=1;
  if(hint)hint.innerHTML=punish?'惩罚任务固定为 1 次':'大于 1 时每天需打卡多次，每次得分';
}
function openTemplateAssign(id){
  const t=state.habitTemplates.find(x=>x.id===id);if(!t)return;
  const memberOpts=state.members.map(m=>`<option value="${m.id}">${m.avatar} ${m.name}</option>`).join('');
  openModal(`<h3>下发模板任务</h3>
    <button class="close-btn" onclick="closeModal()">×</button>
    <p style="font-size:13px;color:var(--text-2);margin-bottom:14px">将「${t.name}」下发给成员，该成员的习惯列表将新增此任务。</p>
    <div class="form-group"><label>选择成员</label>
      <select id="assignMember">${memberOpts}</select></div>
    <button class="btn-primary" onclick="assignTemplate('${id}')">下发</button>
  `);
}
function assignTemplate(id){
  const t=state.habitTemplates.find(x=>x.id===id);if(!t)return;
  const mid=document.getElementById('assignMember').value;
  const m=state.members.find(x=>x.id===mid);if(!m)return;
  m.habits.push({id:uid(),name:t.name,icon:t.icon,points:t.points,freq:t.freq,days:t.days,goalDays:t.goalDays||0,targetTimes:t.targetTimes||1,active:true});
  saveData();closeModal();render();
  showToast('已下发给 '+m.name,'📨');
}

// ======================= 安全设置（修改口令） =======================
function openPwdChange(){
  openModal(`<h3>修改管理口令</h3>
    <button class="close-btn" onclick="closeModal()">×</button>
    <div class="form-group"><label>当前口令</label>
      <input type="password" id="oldPwd" placeholder="请输入当前口令"></div>
    <div class="form-group"><label>新口令</label>
      <input type="password" id="newPwd1" placeholder="请输入新口令"></div>
    <div class="form-group"><label>确认新口令</label>
      <input type="password" id="newPwd2" placeholder="再次输入新口令"></div>
    <button class="btn-primary" onclick="savePwdChange()">保存新口令</button>
  `);
}
function savePwdChange(){
  const oldPwd=document.getElementById('oldPwd').value;
  if(oldPwd!==state.adminPwd){showToast('当前口令错误','❌');return}
  const p1=document.getElementById('newPwd1').value.trim();
  const p2=document.getElementById('newPwd2').value.trim();
  if(!p1){showToast('请输入新口令','❌');return}
  if(p1!==p2){showToast('两次输入不一致','❌');return}
  state.adminPwd=p1;saveData();closeModal();render();
  showToast('口令已更新','🔒');
}

// ======================== Modal ========================
function fmtBytes(b){
  if(b>=1048576)return (b/1048576).toFixed(1)+' MB';
  if(b>=1024)return (b/1024).toFixed(1)+' KB';
  return b+' B';
}
function showStorageDetail(){
  const d=detectStorage();
  const ua=(navigator.userAgent||'').match(/Chrome\/[\d.]+|Firefox\/[\d.]+|Safari\/[\d.]+|Edg\/[\d.]+|OPR\/[\d.]+/g);
  const browser=ua?ua.join(', '):'未知浏览器';
  const html=
    '<h3>数据与存储详情</h3><button class="close-btn" onclick="closeModal()">×</button>'+
    '<div style="font-size:13px;color:var(--text-2);margin-bottom:14px">数据仅保存在本机浏览器中，不联网上传。</div>'+
    '<div class="form-group"><label>检测结果</label>'+
    '<div style="padding:12px;border-radius:8px;background:'+(d.ok?'var(--accent-lt)':'#FFF4E0')+';color:'+(d.ok?'var(--accent)':'#9A6A00')+'">'+
    (d.ok?'✅ 本地存储可用，数据可持久保存':'❌ 本地存储不可用：'+(d.note||'浏览器禁用了 localStorage'))+'</div></div>'+
    '<div class="form-group"><label>存储位置</label><div>'+(d.ok?'本机浏览器 localStorage':'内存（本次浏览有效，刷新丢失）')+'</div></div>'+
    '<div class="form-group"><label>当前占用</label><div>'+(d.ok&&d.bytes!==undefined?fmtBytes(d.bytes):'—')+'</div></div>'+
    '<div class="form-group"><label>浏览器</label><div>'+browser+'</div></div>'+
    (d.ok?'':'<div style="font-size:12px;color:#9A6A00;background:#FFF4E0;padding:10px;border-radius:8px">提示：请在浏览器设置中允许本站点存储数据，或改用 Chrome / Edge 浏览器。兼容模式下数据仅本次会话有效。</div>')+
    '<button class="btn-primary" onclick="closeModal()">知道了</button>';
  openModal(html);
}
// ======================== 数据备份与恢复 ========================
function exportData(){
  if(!state.members||state.members.length===0){showToast('暂无数据可导出','❌');return}
  const backup={
    app:'habit-tracker',
    version:'2.2',
    exportedAt:nowStr(),
    data:state
  };
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='习惯养成备份_'+todayStr()+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},100);
  showToast('备份文件已导出','📦');
}
function handleImportFile(input){
  const file=input.files&&input.files[0];
  if(!file){return}
  const reader=new FileReader();
  reader.onload=e=>{
    let backup;
    try{backup=JSON.parse(e.target.result)}
    catch(err){showToast('文件格式错误，导入失败','❌');return}
    if(!backup||backup.app!=='habit-tracker'||!backup.data||!Array.isArray(backup.data.members)){
      showToast('不是有效的备份文件','❌');return;
    }
    const d=backup.data;
    const memberNames=d.members.map(m=>m.name).join('、');
    const totalHabits=d.members.reduce((s,m)=>s+(m.habits?m.habits.length:0),0);
    // 二次确认
    openModal('<h3>导入备份确认</h3><button class="close-btn" onclick="closeModal()">×</button>'
      +'<div style="font-size:13px;color:var(--text-2);margin-bottom:14px">导入后<b style="color:#c33">将覆盖当前全部数据</b>（成员、习惯、积分、打卡记录），请确认备份文件无误。</div>'
      +'<div class="form-group"><label>备份时间</label><div>'+(backup.exportedAt||'—')+'</div></div>'
      +'<div class="form-group"><label>成员</label><div>'+memberNames+'（共 '+d.members.length+' 人）</div></div>'
      +'<div class="form-group"><label>任务数</label><div>共 '+totalHabits+' 个习惯任务</div></div>'
      +'<button class="btn-primary" onclick="confirmImport()">确认导入</button>'
      +'<button class="btn-danger" onclick="closeModal()">取消</button>');
    window.__pendingImport=d;
  };
  reader.onerror=()=>{showToast('读取文件失败','❌')};
  reader.readAsText(file,'utf-8');
  input.value=''; // 允许重复选择同一文件
}
function confirmImport(){
  const d=window.__pendingImport;
  if(!d){closeModal();return}
  state=d;
  if(!state.currentMemberId&&state.members[0])state.currentMemberId=state.members[0].id;
  if(!state.currentTab)state.currentTab='habits';
  if(!state.mineView)state.mineView='main';
  state.adminUnlocked=false; // 导入恢复后需重新输入口令，防误操作
  saveData();closeModal();render();
  window.__pendingImport=null;
  showToast('数据已恢复','✅');
}
function openModal(html){
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}
document.getElementById('modalOverlay').addEventListener('click',e=>{
  if(e.target.id==='modalOverlay')closeModal();
});

// ======================== Init ========================
// 导入文件选择事件（事件委托，因 importFile 是动态渲染的）
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='importFile')handleImportFile(e.target);
});

detectStorage();      // 先检测浏览器存储兼容性
initState();
settlePunishments();  // 结算昨日未做到的惩罚任务（自动扣分）
render();
applyStorageBanner(); // 存储不可用时显示警示横幅
</script>
