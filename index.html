<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>习惯养成</title>
<meta name="theme-color" content="#4A90D9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="习惯养成">
<link rel="manifest" href="/helper/manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{
  --blue:#4A90D9;--blue-lt:#E8F2FC;--blue-dk:#3A7BC8;
  --bg:#F5F7FA;--card:#fff;--text:#333;--text-2:#888;
  --radius:12px;--shadow:0 2px 12px rgba(0,0,0,.08);
  --glass-bg:rgba(255,255,255,.92);--glass-bd:rgba(74,144,217,.2);
}
[data-mode="child"]{--accent:#FF6B9D;--accent-lt:#FFF0F5;--accent-dk:#E85585;
  --bg:#FFF8FB;--card:#fff;--radius:16px;--shadow:0 4px 16px rgba(255,107,157,.12)}
[data-mode="teen"]{--accent:#4A90D9;--accent-lt:#E8F2FC;--accent-dk:#3A7BC8}
[data-mode="simple"]{--accent:#5B6B7D;--accent-lt:#EEF1F4;--accent-dk:#4A5A6D;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
html{overscroll-behavior-y:none}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);
  transition:background .3s;min-height:100vh;overscroll-behavior-y:none}
/* layout */
.app{max-width:720px;margin:0 auto;padding:16px 16px 90px;min-height:100vh}
/* header */
.header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px}
.header h1{font-size:20px;color:var(--accent);font-weight:700}
.header .actions{display:flex;gap:8px;align-items:center}
.back-btn{display:flex;align-items:center;gap:4px;padding:8px 14px;border:none;border-radius:20px;
  background:var(--accent-lt);color:var(--accent);font-size:14px;font-weight:500;cursor:pointer}
.back-btn:active{opacity:.7}
/* progress ring */
.progress-section{display:flex;align-items:center;gap:16px;padding:16px;background:var(--card);
  border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.ring{position:relative;width:64px;height:64px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .bg-c{fill:none;stroke:var(--accent-lt);stroke-width:6}
.ring .fg-c{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .5s}
.ring .pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;font-weight:700;color:var(--accent)}
.progress-info{flex:1}
.progress-info .label{font-size:13px;color:var(--text-2);margin-bottom:4px}
.progress-info .streak{font-size:15px;font-weight:600}
.progress-info .streak .fire{color:#FF6B35}
/* stat cards */
.stat-row{display:flex;gap:10px;margin-bottom:16px}
.stat-card{flex:1;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 10px;text-align:center}
.stat-card .num{font-size:22px;font-weight:700;color:var(--accent)}
.stat-card .lbl{font-size:11px;color:var(--text-2);margin-top:4px}
/* habit list */
.section-title{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.section-title .add-link{font-size:13px;color:var(--accent);cursor:pointer;font-weight:400}
.habit-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);
  border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;
  transition:all .2s;border:2px solid transparent}
.habit-item:active{transform:scale(.98)}
.habit-item.done{opacity:.6}
.habit-item.done .habit-name{text-decoration:line-through}
.habit-item.locked{opacity:.65;background:#f7f8fa}
.habit-item.locked .habit-name{color:var(--text-2)}
.habit-lock{display:block;font-size:11px;color:#b0a0a0;font-weight:600;margin-top:4px}
.habit-item.locked .habit-check{border-color:#ccc;color:#999}
.habit-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:22px;flex-shrink:0;background:var(--accent-lt)}
.habit-body{flex:1;min-width:0}
.habit-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habit-meta{font-size:12px;color:var(--text-2);margin-top:3px;display:flex;gap:8px;align-items:center}
.habit-meta .pts{color:var(--accent);font-weight:600}
.habit-meta .pts.punish{color:#e74c3c;font-weight:700}
.habit-meta .pts .punish-tip{font-size:10px;color:#e74c3c;opacity:.8;font-weight:400}
.pts-punish-lbl{font-size:11px;color:#e74c3c;font-weight:500}
.habit-item.punish-item .habit-check{border-color:#e74c3c}
.habit-item.punish-item.done .habit-check{background:#e74c3c;color:#fff;border-color:#e74c3c}
.habit-item.punish-item.done{opacity:1}
.habit-item.punish-item.done .habit-name{text-decoration:line-through;color:var(--text-2)}
.habit-item.expired-item{background:#FBF3F2}
.habit-item.expired-item .habit-icon{filter:grayscale(.6);opacity:.7}
.habit-goal{display:block;font-size:11px;color:var(--accent);font-weight:600;margin-top:4px}
.habit-goal .g-bar{display:block;height:4px;background:var(--accent-lt);border-radius:2px;margin-top:4px;overflow:hidden}
.habit-goal .g-bar .g-fill{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.habit-check{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--accent);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .3s}
.habit-item.done .habit-check{background:var(--accent);color:#fff}
.habit-check .ck{font-size:16px;opacity:0;transition:opacity .2s}
.mini-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);
  background:var(--accent-lt);color:var(--accent);font-size:17px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  padding:0;font-family:inherit;transition:all .2s}
.mini-btn:active:not(:disabled){transform:scale(.88);background:var(--accent);color:#fff}
.mini-btn:disabled{border-color:#ccc;color:#aaa;background:#f2f2f2;cursor:not-allowed}
.mini-btn.minus:disabled{opacity:.6}
.mini-btn-wide{width:auto;padding:0 14px;font-size:13px}
/* 耗时任务进行中状态：主题色描边高亮 */
.habit-item.running-item{box-shadow:0 0 0 2px var(--accent-lt),var(--shadow)}
/* 番茄时钟倒计时大字 */
.pomo-clock{font-size:26px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;
  letter-spacing:1px;line-height:1.2;margin:2px 0}
[data-mode="child"] .pomo-clock{font-size:32px}
/* 独立番茄钟页 */
.pomo-page{padding:36px 20px;text-align:center}
.pomo-clock-big{font-size:64px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;
  letter-spacing:2px;line-height:1.1;margin:14px 0 6px}
[data-mode="child"] .pomo-clock-big{font-size:80px}
.pomo-state{font-size:15px;color:var(--text-2);margin-bottom:26px}
.pomo-state.running{color:var(--accent);font-weight:600}
.pomo-len-row{display:flex;gap:10px;justify-content:center;margin-bottom:26px}
.pomo-len-pill{padding:8px 18px;border-radius:20px;border:2px solid var(--accent);background:#fff;
  color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.pomo-len-pill.active{background:var(--accent);color:#fff}
.pomo-len-pill:disabled{border-color:#ddd;color:#aaa;background:#f5f5f5;cursor:not-allowed}
.pomo-big-btn{display:block;width:100%;max-width:280px;margin:8px auto;padding:14px;border:none;
  border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.pomo-big-btn:active{opacity:.85}
.pomo-big-btn.ghost{background:var(--accent-lt);color:var(--accent)}
.pomo-big-btn.plain{background:#fff;color:var(--text-2);border:1.5px solid #e5e5e5;font-weight:500}
.pomo-stats{display:flex;gap:12px;margin-top:32px}
.pomo-stat-card{flex:1;background:var(--card);border-radius:16px;padding:16px 10px;box-shadow:var(--shadow)}
.pomo-stat-card .num{font-size:22px;font-weight:700;color:var(--accent)}
.pomo-stat-card .lbl{font-size:12px;color:var(--text-2);margin-top:4px}
/* 排行榜页 */
.lb-page{padding:24px 16px}
.lb-title{text-align:center;font-size:20px;font-weight:700;color:var(--accent);margin-bottom:16px}
.lb-pills{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
.lb-pill{padding:7px 16px;border-radius:20px;border:2px solid var(--accent);background:#fff;
  color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.lb-pill.active{background:var(--accent);color:#fff}
.lb-list{max-width:560px;margin:0 auto}
.lb-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;
  padding:12px 16px;box-shadow:var(--shadow);margin-bottom:10px;border:2px solid transparent}
.lb-row.me{border-color:var(--accent);background:var(--accent-lt)}
.lb-row.top1{box-shadow:0 2px 12px rgba(255,176,32,.25)}
.lb-rank{width:34px;height:34px;border-radius:50%;background:#f2f2f2;display:flex;align-items:center;
  justify-content:center;font-size:16px;font-weight:700;color:var(--text-2);flex-shrink:0}
.lb-rank.r1{background:#FFF3CC}.lb-rank.r2{background:#F0F0F0}.lb-rank.r3{background:#FBE4D5}
.lb-avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:22px}
.lb-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.lb-name{flex:1;min-width:0;font-size:16px;font-weight:600;color:var(--text-1)}
.lb-me-badge{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--accent);
  border-radius:8px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.lb-val{font-size:16px;font-weight:700;color:var(--accent);flex-shrink:0}
[data-mode="child"] .lb-name{font-size:18px}
[data-mode="child"] .lb-val{font-size:18px}
.habit-item.done .habit-check .ck{opacity:1}
[data-mode="child"] .habit-item{padding:16px}
[data-mode="child"] .habit-icon{width:56px;height:56px;font-size:30px;border-radius:16px}
[data-mode="child"] .habit-name{font-size:18px}
[data-mode="child"] .habit-check{width:36px;height:36px}
[data-mode="child"] .habit-check .ck{font-size:22px}
/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);
  box-shadow:0 -2px 12px rgba(0,0,0,.06);z-index:100;max-width:720px;margin:0 auto}
.tab{flex:1;padding:12px 0;text-align:center;cursor:pointer;color:var(--text-2);transition:color .2s;border:none;background:none}
.tab .tab-ic{font-size:24px;display:block}
.tab .tab-lb{font-size:11px;display:block;margin-top:3px;font-weight:500}
.tab.active{color:var(--accent)}
[data-mode="child"] .tab .tab-lb{font-size:12px}
[data-mode="child"] .tab .tab-ic{font-size:28px}
/* mine: profile */
.mine-profile{display:flex;align-items:center;gap:14px;padding:18px;background:var(--card);
  border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.mine-avatar{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:36px;flex-shrink:0;overflow:hidden}
.mine-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.user-chip img,.mc-avatar img{width:100%;height:100%;object-fit:cover;display:block}
/* 点击头像放大预览：可点击态 */
.avatar-viewable{position:relative;display:flex;align-items:center;justify-content:center;
  overflow:visible;cursor:zoom-in;transition:transform .2s}
.avatar-viewable:active{transform:scale(.92)}
.avatar-viewable img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
/* 头像全屏预览：尽量铺满屏幕，点击任意处关闭 */
.av-viewer{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.95);z-index:300;
  display:none;align-items:center;justify-content:center;cursor:zoom-out}
.av-viewer.show{display:flex}
.av-viewer .photo{width:100vw;height:100vh;object-fit:contain;display:block;animation:avPop .25s}
.av-viewer .emoji-photo{font-size:min(55vw,55vh,480px);line-height:1;user-select:none;animation:avPop .25s}
@keyframes avPop{from{transform:scale(.88);opacity:.4}to{transform:scale(1);opacity:1}}
.av-viewer .av-name{position:absolute;bottom:40px;left:0;right:0;text-align:center;color:rgba(255,255,255,.92);
  font-size:17px;font-weight:600;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.av-viewer .av-close{position:absolute;top:14px;right:18px;color:rgba(255,255,255,.9);font-size:32px;
  background:none;border:none;cursor:pointer;padding:6px 10px;line-height:1}
.av-viewer .av-tip{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.4);
  font-size:11px;pointer-events:none}
.mine-info{flex:1;min-width:0}
.mine-name{font-size:18px;font-weight:700;color:var(--accent)}
.mine-meta{font-size:12px;color:var(--text-2);margin-top:4px}
.mine-points{font-size:22px;font-weight:700;color:var(--accent);flex-shrink:0}
.mine-points .lbl{display:block;font-size:11px;color:var(--text-2);font-weight:400;text-align:center}
.switch-user-btn{flex-shrink:0;padding:8px 14px;border:none;border-radius:20px;background:var(--accent-lt);
  color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.switch-user-btn:active{opacity:.7}
[data-mode="child"] .mine-avatar{width:76px;height:76px;font-size:44px}
[data-mode="child"] .mine-name{font-size:20px}
/* mine: member switch grid */
.member-grid{display:flex;gap:10px;overflow-x:auto;padding:2px 0 14px;-ms-overflow-style:none;scrollbar-width:none}
.member-grid::-webkit-scrollbar{display:none}
.member-card{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 18px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);
  cursor:pointer;border:2.5px solid transparent;transition:all .2s;min-width:84px}
.member-card.active{border-color:var(--accent);background:var(--accent-lt)}
.member-card .mc-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:26px;overflow:hidden}
.member-card .mc-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.member-card .mc-name{font-size:13px;font-weight:500}
.member-card .mc-pts{font-size:11px;color:var(--text-2)}
.member-card.add{border-style:dashed;border-color:#ccc;background:transparent;box-shadow:none}
.member-card.add .mc-add{font-size:28px;color:var(--accent);width:48px;height:48px;display:flex;align-items:center;justify-content:center}
[data-mode="child"] .member-card .mc-avatar{width:58px;height:58px;font-size:32px}
/* mine: menu list */
.menu-list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.menu-item{display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer;transition:background .15s;
  border-bottom:1px solid #f2f2f2}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:var(--accent-lt)}
.menu-item .m-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:22px;flex-shrink:0;background:var(--accent-lt)}
.menu-item .m-body{flex:1}
.menu-item .m-name{font-size:15px;font-weight:500}
.menu-item .m-desc{font-size:11px;color:var(--text-2);margin-top:2px}
.menu-item .m-arrow{font-size:20px;color:var(--text-2);flex-shrink:0}
[data-mode="child"] .menu-item{padding:18px}
[data-mode="child"] .menu-item .m-ic{width:50px;height:50px;font-size:28px}
[data-mode="child"] .menu-item .m-name{font-size:17px}
/* history log */
.log-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);
  border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:8px}
.log-item .l-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0;background:var(--accent-lt)}
.log-item .l-body{flex:1;min-width:0}
.log-item .l-title{font-size:14px;font-weight:500}
.log-item .l-time{font-size:11px;color:var(--text-2);margin-top:2px}
.log-item .l-pts{font-size:16px;font-weight:700;flex-shrink:0}
.log-item .l-pts.plus{color:#4CAF50}
.log-item .l-pts.minus{color:#F44336}
[data-mode="child"] .log-item{padding:14px}
[data-mode="child"] .log-item .l-ic{width:44px;height:44px;font-size:24px}
[data-mode="child"] .log-item .l-title{font-size:16px}
/* reward & badge grid */
.reward-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.reward-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px 12px;text-align:center;cursor:pointer;transition:all .2s;border:2px solid transparent}
.reward-card:active{transform:scale(.96)}
.reward-card .r-ic{font-size:36px;margin-bottom:8px}
.reward-card .r-nm{font-size:14px;font-weight:500;margin-bottom:6px}
.reward-card .r-pts{font-size:13px;color:var(--accent);font-weight:600}
.reward-card.disabled{opacity:.45;cursor:not-allowed}
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badge-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 8px;text-align:center}
.badge-card.locked{opacity:.4;filter:grayscale(.6)}
.badge-card .b-ic{font-size:34px;margin-bottom:6px}
.badge-card .b-nm{font-size:12px;font-weight:500}
.badge-card .b-desc{font-size:10px;color:var(--text-2);margin-top:4px}
/* admin view */
.approval-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);
  border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px}
.approval-item .a-ic{font-size:28px}
.approval-item .a-body{flex:1}
.approval-item .a-nm{font-size:14px;font-weight:500}
.approval-item .a-meta{font-size:12px;color:var(--text-2);margin-top:2px}
.approval-item .a-btns{display:flex;gap:8px}
.a-btn{padding:6px 14px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500}
.a-btn.approve{background:var(--accent);color:#fff}
.a-btn.reject{background:#eee;color:#666}
.empty{text-align:center;padding:40px 20px;color:var(--text-2)}
.empty .em-ic{font-size:48px;margin-bottom:12px;opacity:.4}
/* modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);
  backdrop-filter:blur(4px);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--glass-bg);border:1px solid var(--glass-bd);border-radius:20px 20px 0 0;
  width:100%;max-width:720px;max-height:85vh;overflow-y:auto;padding:20px;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:18px;margin-bottom:16px;color:var(--accent)}
.modal .close-btn{position:absolute;top:16px;right:20px;font-size:24px;cursor:pointer;color:var(--text-2);background:none;border:none}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:15px;
  background:#fff;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);outline:none}
.color-presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

<script>
// ======================== Data Layer ========================
const STORAGE_KEY='habit_tracker_v1';
let state={members:[],currentMemberId:null,currentTab:'habits',mineView:'main',adminUnlocked:false,adminPwd:'1234',habitTemplates:[]};
let cachedData=null;
// 存储兼容性状态：storageOK 表示 localStorage 可用；storageMode='local'|'memory'
let storageOK=true,storageMode='local',storageNote='';

// ---------- 浏览器存储兼容性检测 ----------
// 检测 localStorage 是否真正可用（隐私模式/禁用存储时访问会抛异常）
function testLocalStorage(){
  try{
    const k='__habit_test__';
    window.localStorage.setItem(k,'1');
    const v=window.localStorage.getItem(k);
    window.localStorage.removeItem(k);
    if(v!=='1')throw new Error('readback failed');
    return true;
  }catch(e){return false;}
}
// 估算已用存储量（字节），不可用时返回 0
function calcStorageUsed(){
  try{
    let bytes=0;
    for(let i=0;i<window.localStorage.length;i++){
      const k=window.localStorage.key(i);
      if(!k)continue;
      const v=window.localStorage.getItem(k)||'';
      bytes+=(k.length+v.length)*2; // UTF-16 约 2 字节/字符
    }
    return bytes;
  }catch(e){return 0;}
}
// 检测浏览器兼容性，结果写入全局；返回对象
let storageDetected=false;
function detectStorage(){
  const info={ok:true,mode:'local',note:'',used:0};
  if(storageDetected){
    // 快速返回缓存结果（但仍实时计算占用）
    info.ok=storageOK;info.mode=storageMode;info.note=storageNote;
    if(storageOK){try{info.bytes=calcStorageUsed();}catch(e){info.bytes=0;}}
    return info;
  }
  storageDetected=true;
  try{
    if(typeof window.localStorage==='undefined'){
      info.ok=false;info.note='当前浏览器不支持 localStorage';
    }else if(!testLocalStorage()){
      info.ok=false;info.note='浏览器禁用了本地存储（可能处于隐私模式或站点数据被禁用）';
    }else{
      info.ok=true;info.note='';
      try{info.bytes=calcStorageUsed();}catch(e){info.bytes=0;}
    }
  }catch(e){
    // 访问 localStorage 本身抛异常（如隐私模式）
    info.ok=false;info.note='浏览器禁用了本地存储（可能处于隐私模式或站点数据被禁用）';
  }
  storageOK=info.ok;
  storageMode=info.ok?'local':'memory';
  storageNote=info.note;
  return info;
}
function applyStorageBanner(){
  const b=document.getElementById('storageBanner');
  if(b){b.style.display=storageOK?'none':'block';}
}
// 统一的存储读写：localStorage 不可用时降级为内存（本次会话内可用）
function storageGet(k){
  if(storageOK){try{return window.localStorage.getItem(k);}catch(e){}}
  return (window.__memStore&&window.__memStore[k])||null;
}
function storageSet(k,v){
  if(storageOK){try{window.localStorage.setItem(k,v);return;}catch(e){}}
  if(!window.__memStore)window.__memStore={};
  window.__memStore[k]=v;
}
function storageRemove(k){
  if(storageOK){try{window.localStorage.removeItem(k);return;}catch(e){}}
  if(window.__memStore)delete window.__memStore[k];
}

function initState(){
  const saved=loadData();
  if(saved&&saved.members&&saved.members.length>0){
    state=saved;
    if(!state.currentMemberId&&state.members[0])state.currentMemberId=state.members[0].id;
    if(!state.currentTab)state.currentTab='habits';
    if(state.adminUnlocked===undefined)state.adminUnlocked=false;
    if(!state.adminPwd)state.adminPwd='1234';
    if(!state.habitTemplates){

      state.pomo={len:25,sess:null,todayCount:0,todayFocusMs:0,totalPomos:0,todayDate:todayStr()};

    if(!state.adminPwd)state.adminPwd='1234';

    if(state.mineView==='admin')state.mineView='main'; // 未解锁时不允许停留在管理页
    saveData(); // persist migrations immediately
    // migrate old tabs to new model
    if(['rewards','badges','history'].includes(state.currentTab)){
      state.mineView=state.currentTab;state.currentTab='mine';
    }
    if(state.currentTab==='admin'){state.currentTab='mine';if(state.adminUnlocked)state.mineView='admin';else state.mineView='main'}

// ======================== 惩罚任务结算 ========================
// 每日打开页面时，结算「昨天」未打卡的惩罚任务（负分任务）：没做到即扣分，扣到 0 为止
function settlePunishments(){
  if(!state||!state.members)return;
  const yesterday=dateStrOffset(-1);
  let changed=false;
  state.members.forEach(m=>{
    const settled=(m._punishSettled)||{};
    if(settled[yesterday])return; // 昨天已结算过，防止重复扣
    const ci=m.checkins[yesterday]||{};
    m.habits.forEach(h=>{
      if(h.points>=0)return;          // 仅处理惩罚任务（负分）
      if(!h.active)return;
      if(!isHabitToday(h,yesterdayDow()))return; // 昨天不是执行日不扣
      if(ci[h.id])return;             // 昨天已打卡（做到了）不扣
      const cur=m.points;
      const amount=Math.min(Math.abs(h.points),cur); // 扣到 0 为止
      if(amount<=0){m.points=0;return}
      m.points-=amount;
      logPoints(m,-amount,'未做到：'+h.name,h.icon);
      changed=true;
    });
    settled[yesterday]=true;
    m._punishSettled=settled;
  });
  if(changed)saveData();
}
// 计算相对今天偏移 offset 天的日期字符串（offset=-1 为昨天）
function dateStrOffset(offset){
  const d=new Date();
  d.setDate(d.getDate()+offset);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// ======================== Utility ========================
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getMember(){return state.members.find(m=>m.id===state.currentMemberId)}
function uid(){return 'x'+Date.now()+Math.random().toString(36).slice(2,7)}
function dayOfWeek(){return new Date().getDay()||7}
function yesterdayDow(){const d=new Date();d.setDate(d.getDate()-1);return d.getDay()||7}

function speak(text){if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';
  u.rate=.9;speechSynthesis.speak(u)}}
function nowStr(){const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
    +' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function logPoints(m,delta,reason,icon){
  if(!m.pointLog)m.pointLog=[];
  m.pointLog.unshift({id:uid(),delta:delta,reason:reason,icon:icon||'⭐',
    time:nowStr(),balance:m.points});
  if(m.pointLog.length>200)m.pointLog=m.pointLog.slice(0,200);
}
function showToast(msg,icon){
  const t=document.getElementById('toast');
  t.innerHTML=(icon?'<span class="t-ic">'+icon+'</span>':'')+msg;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);
}

    e.style.animationDelay=(i*.08)+'s';c.appendChild(e)}

// ======================== Rendering ========================
function render(){
  renderHeader();
  renderContent();

}
function applyMode(){
  const m=getMember();
  const mode=m?m.mode:'simple';
  const app=document.getElementById('app');
  document.body.setAttribute('data-mode',mode);
  app.setAttribute('data-mode',mode);
  // 页面主色跟随成员专属颜色（弟弟=蓝、姐姐=粉），而非模式默认色
  if(m&&m.color){
    const accent=m.color;
    const lt=mixColor(accent,'#FFFFFF',0.86);
    const dk=mixColor(accent,'#000000',0.18);
    const shadow='0 2px 12px '+hexToRgba(accent,0.15);
    document.body.style.setProperty('--accent',accent);
    document.body.style.setProperty('--accent-lt',lt);
    document.body.style.setProperty('--accent-dk',dk);
    document.body.style.setProperty('--shadow',shadow);
    app.style.setProperty('--accent',accent);
    app.style.setProperty('--accent-lt',lt);
    app.style.setProperty('--accent-dk',dk);
    app.style.setProperty('--shadow',shadow);
  }else{
    document.body.style.removeProperty('--accent');
    document.body.style.removeProperty('--accent-lt');
    document.body.style.removeProperty('--accent-dk');
    document.body.style.removeProperty('--shadow');
    app.style.removeProperty('--accent');
    app.style.removeProperty('--accent-lt');
    app.style.removeProperty('--accent-dk');
    app.style.removeProperty('--shadow');
  }
  // 状态栏/浏览器主题色跟随当前主色（PWA 沉浸式，安卓状态栏即时生效）
  const themeColors={child:'#FF6B9D',teen:'#4A90D9',simple:'#5B6B7D'};
  const themeColor=(m&&m.color)?m.color:(themeColors[mode]||'#4A90D9');
  const themeMeta=document.querySelector('meta[name="theme-color"]');
  if(themeMeta)themeMeta.setAttribute('content',themeColor);
}
// 混合两种 hex 颜色：ratio 为 mix 色占比（0~1）
function mixColor(hex,mixHex,ratio){
  const h=hex.replace('#',''),mh=mixHex.replace('#','');
  const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  const mr=parseInt(mh.substr(0,2),16),mg=parseInt(mh.substr(2,2),16),mb=parseInt(mh.substr(4,2),16);
  const R=Math.round(r*(1-ratio)+mr*ratio),G=Math.round(g*(1-ratio)+mg*ratio),B=Math.round(b*(1-ratio)+mb*ratio);
  return '#'+[R,G,B].map(v=>v.toString(16).padStart(2,'0')).join('');
}
// hex 颜色转 rgba 字符串
function hexToRgba(hex,a){
  const h=hex.replace('#','');
  const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  return `rgba(${r},${g},${b},${a})`;
}

    const names={rewards:'奖励兑换',badges:'我的徽章',history:'积分记录'};

    title.textContent=names[state.mineView]||'我的';
    actions.innerHTML='<button class="back-btn" onclick="goMineMain()">‹ 返回</button>';
  }else{
    // 主 tab 页：隐藏整个 header，避免标题与底部 tab 名重复

  }
}
function renderTabs(){
  document.querySelectorAll('.tab').forEach(t=>{
    const on=t.dataset.tab===state.currentTab;
    t.classList.toggle('active',on);
  });
}
function renderContent(){
  const el=document.getElementById('mainContent');
  if(state.currentTab==='mine'&&state.mineView==='admin'){renderAdmin(el);return}
  const m=getMember();if(!m){el.innerHTML='<div class="empty"><div class="em-ic">👤</div>请先添加成员</div>';return}
  if(state.currentTab==='habits')renderHabits(el,m);
  else if(state.currentTab==='pomodoro')renderPomo(el);
  else if(state.currentTab==='leaderboard')renderLeaderboard(el);
  else if(state.currentTab==='mine'){
    if(state.mineView==='rewards')renderRewards(el,m);

    else if(state.mineView==='history')renderHistory(el,m);
    else renderMine(el,m);
  }
}

// ---- Habits Tab (今日习惯) ----
function renderHabits(el,m){
  const today=todayStr();const dow=dayOfWeek();
  let activeHabits=m.habits.filter(h=>h.active&&isHabitListed(m,h,dow));
  let doneCount=0;
  activeHabits.forEach(h=>{if(isHabitDone(m,h,today))doneCount++});
  const pct=activeHabits.length?Math.round(doneCount/activeHabits.length*100):0;
  const streak=calcStreak(m);
  const r=28,c=2*Math.PI*r,dash=pct/100*c;
  let html=`<div class="progress-section">
    <div class="user-chip" style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0">
      <div class="avatar-viewable" style="width:44px;height:44px;border-radius:50%;background:${m.color}22;font-size:22px" onclick="showAvatarPreview('${m.id}')" title="查看头像">${avatarHtml(m)}</div>
      <div style="font-size:12px;font-weight:600;color:${m.color}">${m.name}</div>
    </div>
    <div class="ring"><svg width="64" height="64"><circle class="bg-c" cx="32" cy="32" r="${r}"/>
      <circle class="fg-c" cx="32" cy="32" r="${r}" stroke-dasharray="${dash} ${c}"/></svg>
      <div class="pct">${pct}%</div></div>
    <div class="progress-info"><div class="label">今日完成 ${doneCount}/${activeHabits.length}</div>
      <div class="streak"><span class="fire">🔥</span> 连续 ${streak} 天 · 积分 ${m.points}</div></div>
  </div>`;
  html+='<div class="section-title">今日任务</div>';
  if(activeHabits.length===0){
    html+='<div class="empty"><div class="em-ic">📋</div>暂无习惯，请家长在「我的 - 管理设置」中添加</div>';
  }else{
    activeHabits.forEach(h=>{
      const target=h.targetTimes||1;
      const curCnt=getCheckinCount(m,today,h.id);
      const done=curCnt>=target;
      const locked=isLockedHabit(m,h);
      let goalHtml='';
      if(h.goalDays){
        const cnt=countHabitDays(m,h);
        const gpct=Math.min(100,Math.round(cnt/h.goalDays*100));
        const finished=cnt>=h.goalDays;
        goalHtml=`<div class="habit-goal">${finished?'🎉 已完成目标！':'第 '+cnt+' / '+h.goalDays+' 天'}
          <span class="g-bar"><span class="g-fill" style="width:${gpct}%"></span></span></div>`;
      }
      let timesHtml='';
      if(target>1){
        const tpct=Math.min(100,Math.round(curCnt/target*100));
        timesHtml=`<div class="habit-goal">${done?'✅ 已完成 '+target+' 次':curCnt+'/'+target+' 次'}
          <span class="g-bar"><span class="g-fill" style="width:${tpct}%"></span></span></div>`;
      }
      // 累计目标进度（跨天总次数，如一套分级读物全部刷完）
      let totalHtml='';
      if(h.totalTargetTimes>0){
        const tCnt=countHabitTimes(m,h);
        const tTot=h.totalTargetTimes;
        const tPct=Math.min(100,Math.round(tCnt/tTot*100));
        const tDone=tCnt>=tTot;
        totalHtml=`<div class="habit-goal">${tDone?'🎉 已完成全部 '+tTot+' 次':'📚 累计 '+tCnt+'/'+tTot+' 次'}
          <span class="g-bar"><span class="g-fill" style="width:${tPct}%"></span></span></div>`;
      }
      let lockHtml='';
      if(locked){
        const pre=findHabit(m,h.prereq);
        lockHtml=`<div class="habit-lock">🔒 先完成「${pre?pre.name:'前置任务'}」</div>`;
      }
      const isPunish=h.points<0;
      const ptsHtml=isPunish
        ? `<span class="pts punish">${h.points}分 <span class="punish-tip">没做到才扣</span></span>`
        : `<span class="pts">+${h.points}分${target>1?'/次 · 每日'+target+'次':''}</span>`;
      if(h.freq==='ebbinghaus'){
        // 艾宾浩斯复习：只在学习日/到期日出现（isHabitToday 过滤），阶段进度 + 间隔安排
        const stage=h.ebbStage||0;
        const doneToday=getCheckinCount(m,today,h.id)>0;
        const epct=Math.min(100,Math.round(stage/EBB_TOTAL*100));
        const barHtml=`<div class="habit-goal">${stage>=EBB_TOTAL?'🎉 已记住！':'🧠 记忆进度 '+stage+'/'+EBB_TOTAL+' 次'}

        let runningHtml='';
        let btnHtml='';
        if(activeSess){

          if(h.pomodoro>0){

              btnHtml=`<button class="mini-btn mini-btn-wide" onclick="adjustCheckin('${h.id}',1)" title="打卡完成并结束计时">⏹ 完成</button>`;
            }else if(inRest){

              runningHtml=`<div class="habit-goal" style="color:var(--text-2)">休息一下 · 已完成 ${s.pomosDone||0} 个番茄</div>`;
              btnHtml=`<button class="mini-btn mini-btn-wide" onclick="startNextPomo('${h.id}')" title="提前结束休息，继续专注">🍅 继续</button><button class="mini-btn mini-btn-wide" onclick="adjustCheckin('${h.id}',1)" title="打卡完成并结束计时">⏹ 完成</button>`;
            }else{

          }else{

            runningHtml=`<div class="habit-goal" style="color:var(--accent);font-weight:600">🔴 进行中 · 已开始 ${elapsed<1?'不到 1':elapsed} 分钟</div>`;
            btnHtml=`<button class="mini-btn mini-btn-wide" onclick="adjustCheckin('${h.id}',1)" ${locked?'disabled':''} title="打卡完成并结束计时">⏹ 完成</button>`;

        }else if(done){

          btnHtml=`<button class="mini-btn mini-btn-wide" onclick="startTaskSession('${h.id}')" ${locked?'disabled':''} title="开始计时">▶ 开始</button>`;
        }

          <div class="habit-icon">${h.icon}</div>
          <div class="habit-body"><div class="habit-name">${h.name}</div>
            <div class="habit-meta">${ptsHtml}${isPunish?'<span class="pts-punish-lbl">⚠️ 没做到要扣分</span>':''}</div>${timesHtml}${totalHtml}${goalHtml}${lockHtml}</div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
            <button class="mini-btn" onclick="adjustCheckin('${h.id}',-1)" ${curCnt<=0?'disabled':''} title="撤销一次">−</button>

  const goals=m.habits.filter(h=>h.active&&h.freq==='deadline');

  }
  el.innerHTML=html;

// 判断某习惯今日是否被前置任务锁定（前置未完成）
// 艾宾浩斯打卡：首学或到期复习，推进阶段并安排下次间隔
function ebbingCheckin(habitId){
  const m=getMember();if(!m)return;
  const today=todayStr();
  const h=m.habits.find(x=>x.id===habitId);if(!h||h.freq!=='ebbinghaus')return;
  const stage=h.ebbStage||0;
  if(stage>=EBB_TOTAL){showToast('已完成全部复习，已记住！','🎉');return}
  if(stage>0&&(h.ebbNext||'')>today){showToast('还未到复习时间','⏳');return}
  if(getCheckinCount(m,today,habitId)>0)return;
  if(!m.checkins[today])m.checkins[today]={};
  m.checkins[today][habitId]=1;
  if(h.points>0){
    m.points+=h.points;
    logPoints(m,h.points,(stage===0?'学习':'复习')+'：'+h.name,h.icon);
  }
  h.ebbStage=stage+1;
  if(h.ebbStage>=EBB_TOTAL){
    h.ebbNext=null;
    showToast('🎉 已完成全部复习，「'+h.name+'」记住了！','🏆');
    if(m.mode==='child')speak('太棒了，你全部记住了'+h.name);
    celebrate();
    checkBadges(m);
  }else{
    const gap=EBB_INTERVALS[h.ebbStage-1];
    h.ebbNext=dateStrOffset(gap);
    showToast((stage===0?'学习完成！':'复习完成！')+'下次 '+gap+' 天后','📖');
    if(m.mode==='child')speak('太棒了');
    celebrate();
    checkBadges(m);
  }
  saveData();render();
}
// 艾宾浩斯撤销：回退阶段并按原打卡日重算下次间隔
function ebbingUndo(habitId){
  const m=getMember();if(!m)return;
  const h=m.habits.find(x=>x.id===habitId);if(!h||h.freq!=='ebbinghaus')return;
  const stage=h.ebbStage||0;
  if(stage<=0)return;
  let lastDay=null;
  Object.keys(m.checkins).sort().forEach(ds=>{if(getCheckinCount(m,ds,habitId)>0)lastDay=ds});
  if(!lastDay)return;
  delete m.checkins[lastDay][habitId];
  if(Object.keys(m.checkins[lastDay]).length===0)delete m.checkins[lastDay];
  if(h.points>0){m.points-=h.points;logPoints(m,-h.points,'撤销复习：'+h.name,h.icon)}
  h.ebbStage=stage-1;
  h.ebbNext=(h.ebbStage<=0)?null:offsetDateStr(lastDay,EBB_INTERVALS[h.ebbStage-1]);
  saveData();render();
  showToast('已撤销','↩️');
}
function isLockedHabit(m,h){
  if(!h.prereq)return false;
  const pre=findHabit(m,h.prereq);
  if(!pre)return false;
  return !isHabitDone(m,pre,todayStr());
}
function findHabit(m,id){
  return (m&&m.habits)?m.habits.find(x=>x.id===id):null;
}

// ---- Leaderboard Tab (排行榜：所有人可看，三指标切换) ----
function switchLeaderMetric(k){
  state.leaderMetric=k;
  saveData();render();
}
function renderLeaderboard(el){
  const metric=state.leaderMetric||'points';
  const today=todayStr();const dow=dayOfWeek();
  const rows=state.members.map(m=>{
    const habits=m.habits.filter(h=>h.active&&isHabitListed(m,h,dow));
    let done=0;habits.forEach(h=>{if(isHabitDone(m,h,today))done++});
    const rate=habits.length?done/habits.length:0;
    return {id:m.id,name:m.name,color:m.color,avatarHtml:avatarHtml(m),
      points:m.points,streak:calcStreak(m),rate,done,total:habits.length};
  });
  const key=r=>metric==='points'?r.points:metric==='streak'?r.streak:r.rate;
  const sorted=[...rows].sort((a,b)=>key(b)-key(a));
  sorted.forEach((r,i)=>{
    r.rank=(i>0&&key(r)===key(sorted[i-1]))?sorted[i-1].rank:i+1; // 同值并列同名次
  });
  const pills=[['points','总积分'],['streak','连续天数'],['rate','今日完成']]
    .map(([k,lb])=>`<button class="lb-pill${metric===k?' active':''}" onclick="switchLeaderMetric('${k}')">${lb}</button>`).join('');
  let html=`<div class="lb-page"><div class="lb-title">🏆 排行榜</div>
    <div class="lb-pills">${pills}</div><div class="lb-list">`;
  sorted.forEach(r=>{
    const rankHtml=r.rank===1?'🥇':r.rank===2?'🥈':r.rank===3?'🥉':r.rank;
    const rkCls=r.rank===1?'r1':r.rank===2?'r2':r.rank===3?'r3':'';
    const valHtml=metric==='points'?r.points+' 分'
      :metric==='streak'?'🔥 '+r.streak+' 天'
      :Math.round(r.rate*100)+'%（'+r.done+'/'+r.total+' 项）';
    const isMe=r.id===state.currentMemberId;
    html+=`<div class="lb-row${isMe?' me':''}${r.rank===1?' top1':''}">
      <div class="lb-rank ${rkCls}">${rankHtml}</div>
      <div class="lb-avatar" style="background:${r.color}22">${r.avatarHtml}</div>
      <div class="lb-name">${r.name}${isMe?'<span class="lb-me-badge">我</span>':''}</div>
      <div class="lb-val">${valHtml}</div>
    </div>`;
  });
  html+='</div></div>';
  el.innerHTML=html;
}

// ---- Pomo Tab (独立番茄钟) ----
// 渲染前结算：番茄到点转休息、休息到点回空闲（基于时间戳，页面重开后也能补结算）
function pomoSettle(){
  const p=state.pomo;if(!p||!p.sess)return false;
  const now=Date.now();
  if(p.sess.type==='pomo'&&now>=p.sess.s+p.len*60000){
    p.todayCount++;p.totalPomos++;
    p.todayFocusMs+=p.len*60000;
    const restMin=p.len===45?10:5;
    p.sess={s:now,type:'rest',until:now+restMin*60000};
    saveData();
    playChime();
    showToast('🍅 番茄完成！休息 '+restMin+' 分钟','🍅');
    const m=getMember();
    if(m&&m.mode==='child')speak('番茄完成啦，休息一下');
    return true;
  }
  if(p.sess.type==='rest'&&now>=p.sess.until){
    p.sess=null;
    saveData();
    playChime();
    showToast('休息结束，随时可以继续专注','💪');
    return true;
  }
  return false;
}
let pomoClockTimer=null;
function ensurePomoClockTimer(){
  if(state.pomo&&state.pomo.sess&&!pomoClockTimer)pomoClockTimer=setInterval(pomoClockTick,1000);
}
function pomoClockTick(){
  const p=state.pomo;
  if(!p||!p.sess){if(pomoClockTimer){clearInterval(pomoClockTimer);pomoClockTimer=null}return}
  if(pomoSettle()){render();return} // 状态推进后重渲染（ensurePomoClockTimer 由 renderPomo 触发）
  const el=document.getElementById('pomoClockBig');
  if(el){
    const now=Date.now();
    if(p.sess.type==='pomo')el.textContent='🍅 '+fmtClock(p.sess.s+p.len*60000-now);
    else el.textContent='☕ '+fmtClock(p.sess.until-now);
  }
}
function pomoSetLen(min){
  const p=state.pomo;
  if(p.sess)return; // 进行中不可改时长
  p.len=min;saveData();render();
}
function pomoStart(){
  const p=state.pomo;
  if(p.sess)return;
  ensureAudio();
  p.sess={s:Date.now(),type:'pomo'};
  saveData();render();
  showToast('🍅 开始专注，'+p.len+' 分钟','▶️');
  const m=getMember();
  if(m&&m.mode==='child')speak('开始专注啦，加油');
}
// 提前结束：专注时长计入今日统计，但不计番茄数（番茄数仅自然到点计）
function pomoFinishEarly(){
  const p=state.pomo;
  if(!p.sess||p.sess.type!=='pomo')return;
  const focusMs=Date.now()-p.sess.s;
  p.todayFocusMs+=focusMs;
  p.sess=null;
  saveData();render();
  showToast('本次专注 '+fmtDur(focusMs),'⏹');
}
function pomoSkipRest(){
  const p=state.pomo;
  if(!p.sess||p.sess.type!=='rest')return;
  p.sess=null;
  saveData();render();
  showToast('已跳过休息','⏭️');
}
function pomoAbandon(){
  const p=state.pomo;
  if(!p.sess||p.sess.type!=='pomo')return;
  openModal(`<h3>放弃本次专注？</h3>
    <button class="close-btn" onclick="closeModal()">×</button>
    <p style="font-size:14px;color:var(--text-1);margin-bottom:6px">已专注的 ${fmtDur(Date.now()-p.sess.s)} 将不计入统计。</p>
    <button class="btn-primary" onclick="doPomoAbandon()">确认放弃</button>
    <button class="btn-danger" onclick="closeModal()">继续专注</button>
  `);
}
function doPomoAbandon(){
  state.pomo.sess=null;
  saveData();closeModal();render();
  showToast('已放弃本次专注','✕');
}
function renderPomo(el){
  const p=state.pomo;
  const today=todayStr();
  if(p.todayDate!==today){p.todayDate=today;p.todayCount=0;p.todayFocusMs=0;saveData()} // 跨天重置今日统计
  pomoSettle(); // 渲染前先结算到点会话
  const now=Date.now();
  let html='<div class="pomo-page">';
  if(p.sess&&p.sess.type==='pomo'){
    const remain=p.sess.s+p.len*60000-now;
    html+=`<div class="pomo-clock-big" id="pomoClockBig">🍅 ${fmtClock(remain)}</div>
      <div class="pomo-state running">🔴 专注中 · ${p.len} 分钟番茄</div>
      <button class="pomo-big-btn" onclick="pomoFinishEarly()">⏹ 提前结束（计入专注时长）</button>
      <button class="pomo-big-btn plain" onclick="pomoAbandon()">✕ 放弃本次</button>`;
  }else if(p.sess&&p.sess.type==='rest'){
    const remain=p.sess.until-now;
    html+=`<div class="pomo-clock-big" id="pomoClockBig" style="color:var(--text-2)">☕ ${fmtClock(remain)}</div>
      <div class="pomo-state">休息一下 · 今日已完成 ${p.todayCount} 个番茄</div>
      <button class="pomo-big-btn ghost" onclick="startNextFocus()">🍅 跳过休息，继续专注</button>`;
  }else{
    const lens=[15,25,45];
    const pills=lens.map(l=>`<button class="pomo-len-pill${p.len===l?' active':''}" onclick="pomoSetLen(${l})" ${p.sess?'disabled':''}>${l} 分钟</button>`).join('');
    html+=`<div class="pomo-clock-big" id="pomoClockBig" style="color:var(--text-2)">🍅 ${String(p.len).padStart(2,'0')}:00</div>
      <div class="pomo-state">选好时长，开始专注</div>
      <div class="pomo-len-row">${pills}</div>
      <button class="pomo-big-btn" onclick="pomoStart()">▶ 开始专注</button>`;
  }
  html+=`<div class="pomo-stats">
    <div class="pomo-stat-card"><div class="num">🍅 ${p.todayCount}</div><div class="lbl">今日番茄</div></div>
    <div class="pomo-stat-card"><div class="num">${p.todayFocusMs>0?fmtDur(p.todayFocusMs):'0分钟'}</div><div class="lbl">今日专注</div></div>
    <div class="pomo-stat-card"><div class="num">🍅 ${p.totalPomos}</div><div class="lbl">历史累计</div></div>
  </div></div>`;
  el.innerHTML=html;
  ensurePomoClockTimer();
  if(p.sess&&!pomoClockTimer)pomoClockTimer=setInterval(pomoClockTick,1000);
}
// 休息中跳过休息继续专注（直接开始新番茄）

// ======================== Logic ========================
// ======================== 艾宾浩斯遗忘曲线复习 ========================
// 间隔序列：首学当天 + 隔 1/2/4/7/15/30 天各复习一次，共 7 次打卡
const EBB_INTERVALS=[1,2,4,7,15,30];
const EBB_TOTAL=7;
// 基于指定日期字符串偏移 n 天（dateStrOffset 基于今天，此函数基于任意天）
function offsetDateStr(ds,n){
  const d=new Date(ds+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// 距今天还有几天（基于日期字符串）
function ebbDaysUntil(ds){
  const d=new Date(ds+'T00:00:00');
  const now=new Date();now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}
// 管理列表用：艾宾浩斯任务状态描述
function ebbStateTxt(h){
  const stage=h.ebbStage||0;
  if(stage>=EBB_TOTAL)return '艾宾浩斯 · 🎉 已记住';
  if(stage===0)return '艾宾浩斯 · 待学习';
  const due=(h.ebbNext||'')<=todayStr();
  return '艾宾浩斯 · 第'+stage+'/'+EBB_TOTAL+'次 · '+(due?'今日到期复习':'下次'+ebbDaysUntil(h.ebbNext)+'天后');
}
function isHabitToday(h,dow){
  if(h.freq==='deadline')return false; // 目标任务不算每日任务（不进今日列表/今日完成度）
  if(h.freq==='ebbinghaus'){
    // 艾宾浩斯：已完成全部复习不再显示；未学习或到了复习日（含逾期补卡）才显示
    if((h.ebbStage||0)>=EBB_TOTAL)return false;
    if(!(h.ebbStage>0))return true;
    return (h.ebbNext||'')<=todayStr();
  }
  if(h.freq==='once')return true;
  if(h.freq==='daily')return h.days?h.days.includes(dow):true;
  return true;
}
// ======================== 目标任务（截止日期 + 次数，全局任务） ========================
// 距截止日期剩余天数：0=今天截止，负数=已过期
function goalDaysLeft(h){
  if(!h.deadlineDate)return 0;
  const dl=new Date(h.deadlineDate+'T00:00:00');
  const td=new Date(todayStr()+'T00:00:00');
  return Math.round((dl-td)/86400000);
}
function isGoalDone(m,h){return countHabitTimes(m,h)>=(h.deadlineTimes||1)}
function isGoalExpired(h){return goalDaysLeft(h)<0}
// 目标任务打卡：任意天可打，一天可多次，每次得分；达标即庆祝
function goalCheckin(habitId){
  const m=getMember();if(!m)return;
  const today=todayStr();
  const h=m.habits.find(x=>x.id===habitId);if(!h||h.freq!=='deadline')return;
  const target=h.deadlineTimes||1;
  const total=countHabitTimes(m,h);
  if(total>=target){showToast('目标已达成，无需再打卡','🎉');return}
  if(isGoalExpired(h)){showToast('已过截止日期','⏰');return}
  if(!m.checkins[today])m.checkins[today]={};
  m.checkins[today][habitId]=(m.checkins[today][habitId]||0)+1;
  if(h.points>0){m.points+=h.points;logPoints(m,h.points,'目标打卡：'+h.name,h.icon)}
  const newTotal=total+1;
  const msgs=['太棒了！','做得真好！','继续保持！','你真厉害！','又前进一步！'];
  const msg=msgs[Math.floor(Math.random()*msgs.length)];
  if(newTotal>=target){
    showToast('🎉 目标达成：'+h.name+'（共 '+target+' 次）！','🏆');
    if(m.mode==='child')speak('太棒了，你完成了'+h.name+'的目标挑战');
    celebrate();
  }else{
    showToast(msg+'（'+newTotal+'/'+target+' · 还差 '+(target-newTotal)+' 次）','🎯');
    if(m.mode==='child')speak(msg);
  }
  checkBadges(m);
  // 从未达标到当天有打卡记录也计入连续天数（calcStreak 基于当日任一打卡）
  saveData();render();
}
// 目标任务撤销：退回最近一次打卡并退分
function goalUndo(habitId){
  const m=getMember();if(!m)return;
  const h=m.habits.find(x=>x.id===habitId);if(!h||h.freq!=='deadline')return;
  let lastDay=null;
  Object.keys(m.checkins).sort().forEach(ds=>{if(getCheckinCount(m,ds,habitId)>0)lastDay=ds});
  if(!lastDay)return;
  const cnt=getCheckinCount(m,lastDay,habitId);
  if(cnt<=1)delete m.checkins[lastDay][habitId];else m.checkins[lastDay][habitId]=cnt-1;
  if(Object.keys(m.checkins[lastDay]).length===0)delete m.checkins[lastDay];
  if(h.points>0){m.points-=h.points;logPoints(m,-h.points,'撤销目标打卡：'+h.name,h.icon)}
  saveData();render();
  showToast('已撤销一次','↩️');
}
// 列表口径：与 isHabitToday 的差异——艾宾浩斯任务今日已学习/复习后仍计入今日列表，
// 以「✅ 今日已学/已复习」形态展示并提供撤销入口（否则打卡后卡片消失，误触无法回退）
function isHabitListed(m,h,dow){
  if(h.freq==='ebbinghaus'&&getCheckinCount(m,todayStr(),h.id)>0)return true;
  return isHabitToday(h,dow);
}
// 获取某天某习惯的打卡次数（兼容旧数据 true=1次）
function getCheckinCount(m,day,habitId){
  const ci=m.checkins[day];
  if(!ci)return 0;
  const v=ci[habitId];
  if(v===true)return 1;
  return v||0;
}
// 判断某天某习惯是否已完成（打卡次数≥目标次数）
function isHabitDone(m,h,day){
  const target=h.targetTimes||1;
  return getCheckinCount(m,day,h.id)>=target;
}
function countHabitDays(m,h){
  let cnt=0;
  for(const ds in m.checkins){
    if(getCheckinCount(m,ds,h.id)>0)cnt++;
  }
  return cnt;
}
// 累计打卡总次数（跨天求和，用于「刷完一套 N 本」类进度目标，如牛津树一级全部读完）
function countHabitTimes(m,h){
  let cnt=0;
  for(const ds in m.checkins){
    cnt+=getCheckinCount(m,ds,h.id);
  }
  return cnt;
}
// ======================== 耗时记录（timeLogs：按天存会话，打卡自动结束计时） ========================
// 获取某天某习惯的计时会话列表
function getSessions(m,day,habitId){
  return ((m.timeLogs||{})[day]||{})[habitId]||[];
}
// 进行中的会话（有开始无结束）
function getActiveSession(m,day,habitId){
  return getSessions(m,day,habitId).find(x=>!x.e);
}
// 今日已完成会话的总耗时（毫秒）与次数
function sumSessionDur(m,day,habitId){
  let ms=0,cnt=0;
  getSessions(m,day,habitId).forEach(s=>{if(s.e){ms+=s.e-s.s;cnt++}});
  return {ms,cnt};
}
// 记录开始时间（创建会话；番茄任务同时启动番茄倒计时）
function startTaskSession(habitId){
  const m=getMember();if(!m)return;
  const h=m.habits.find(x=>x.id===habitId);if(!h||!h.trackTime)return;
  if(isLockedHabit(m,h)){
    const pre=findHabit(m,h.prereq);
    showToast('先完成「'+(pre?pre.name:'前置任务')+'」','🔒');
    if(m.mode==='child')speak('先完成'+(pre?pre.name:'前置任务')+'，再来开始'+h.name);
    return;
  }
  const today=todayStr();
  if(!m.timeLogs)m.timeLogs={};
  if(!m.timeLogs[today])m.timeLogs[today]={};
  if(!m.timeLogs[today][habitId])m.timeLogs[today][habitId]=[];
  if(getActiveSession(m,today,habitId))return; // 已在进行中
  const sess={s:Date.now(),e:null};
  if(h.pomodoro>0){sess.pomosDone=0;sess.pomoStart=Date.now();ensureAudio()}
  m.timeLogs[today][habitId].push(sess);
  saveData();render();
  showToast(h.pomodoro>0?'🍅 番茄开始，专注 '+h.pomodoro+' 分钟！':'已开始「'+h.name+'」','▶️');
  if(m.mode==='child')speak('开始'+h.name+'啦，加油');
}
// 继续下一个番茄（休息结束/番茄满后手动继续）
function startNextPomo(habitId){
  const m=getMember();if(!m)return;
  const today=todayStr();
  const sess=getActiveSession(m,today,habitId);
  if(!sess)return;
  sess.pomoStart=Date.now();
  sess.restUntil=null;
  ensureAudio();
  saveData();render();
  showToast('继续专注，加油！','🍅');
  if(m.mode==='child')speak('继续加油');
}
// 毫秒 → 可读时长
function fmtDur(ms){
  const min=Math.max(1,Math.round(ms/60000));
  if(min<60)return min+'分钟';
  return Math.floor(min/60)+'小时'+(min%60?min%60+'分':'');
}
// 毫秒 → mm:ss 倒计时格式
function fmtClock(ms){
  const s=Math.max(0,Math.ceil(ms/1000));
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
// ======================== 番茄时钟（与耗时任务结合，全局每秒 tick，局部刷新倒计时） ========================
let pomoTimer=null,audioCtx=null;
function ensureAudio(){
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}
// 番茄/休息到点提示音（Web Audio 合成叮叮叮，无需外部文件）
function playChime(){
  if(!audioCtx)return;
  try{
    const notes=[880,1108.73,1318.51];
    notes.forEach((f,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      const t0=audioCtx.currentTime+i*0.18;
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.001,t0);
      g.gain.exponentialRampToValueAtTime(0.35,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t0+0.35);
      o.connect(g);g.connect(audioCtx.destination);
      o.start(t0);o.stop(t0+0.4);
    });
  }catch(e){}
}
// 番茄休息时长（45 分钟番茄配 10 分钟休息，其余 5 分钟）
function pomoRestLen(h){return (h.pomodoro===45?10:5)*60000}
// 有进行中番茄/休息会话时启动全局计时器
function ensurePomoTimer(){
  const m=getMember();if(!m)return;
  const today=todayStr();
  const has=m.habits.some(h=>h.trackTime&&h.pomodoro>0&&getActiveSession(m,today,h.id));
  if(has&&!pomoTimer)pomoTimer=setInterval(tickPomo,1000);
}
// 每秒 tick：局部更新倒计时显示；到点（番茄满/休息完）触发提醒并重渲染
function tickPomo(){
  const m=getMember();if(!m)return;
  const today=todayStr();
  const now=Date.now();
  let hasActive=false;
  m.habits.forEach(h=>{
    if(!h.trackTime||!h.pomodoro)return;
    const sess=getActiveSession(m,today,h.id);
    if(!sess)return;
    const pomoLen=h.pomodoro*60000;
    const el=document.getElementById('pomo-clock-'+h.id);
    if(sess.pomoStart&&now<sess.pomoStart+pomoLen){
      hasActive=true; // 番茄中：仅更新倒计时文字
      if(el)el.textContent='🍅 '+fmtClock(sess.pomoStart+pomoLen-now);
    }else if(sess.restUntil&&now<sess.restUntil){
      hasActive=true; // 休息中：仅更新倒计时文字
      if(el)el.textContent='☕ '+fmtClock(sess.restUntil-now);
    }else if(sess.pomoStart&&now>=sess.pomoStart+pomoLen&&!sess.restUntil){
      // 番茄到点：进入休息，提醒
      hasActive=true;
      sess.pomosDone=(sess.pomosDone||0)+1;
      sess.pomoStart=null;
      sess.restUntil=now+pomoRestLen(h);
      saveData();
      playChime();
      showToast('🍅 番茄完成！休息 '+(pomoRestLen(h)/60000)+' 分钟吧','🍅');
      if(m.mode==='child')speak('番茄完成啦，休息一下');
      render();
    }else if(sess.restUntil&&now>=sess.restUntil&&!sess.pomoStart){
      // 休息结束：提醒可继续
      hasActive=true;
      sess.restUntil=null;
      saveData();
      playChime();
      showToast('休息结束，可以继续啦','💪');
      render();
    }
  });
  if(!hasActive&&pomoTimer){clearInterval(pomoTimer);pomoTimer=null}
}
// 单次任务（targetTimes=1）点击切换：完成则撤销，未完成则打卡；多次任务由 ± 按钮调用 adjustCheckin
function toggleCheckin(habitId){
  const m=getMember();if(!m)return;
  const h=m.habits.find(x=>x.id===habitId);if(!h)return;
  const target=h.targetTimes||1;
  const cur=getCheckinCount(m,todayStr(),habitId);
  adjustCheckin(habitId,cur>=target?-1:1);
}
// 多次打卡核心：delta=1 打卡一次 / delta=-1 撤销一次
function adjustCheckin(habitId,delta){
  const m=getMember();if(!m)return;
  const today=todayStr();
  if(!m.checkins[today])m.checkins[today]={};
  const h=m.habits.find(x=>x.id===habitId);if(!h)return;
  const target=h.targetTimes||1;
  const cur=getCheckinCount(m,today,habitId);
  const done=cur>=target;
  const mode=m.mode;
  if(delta>0){
    // ===== 打卡一次 =====
    if(cur>=target){showToast('今天已完成全部次数','✅');return}
    if(isLockedHabit(m,h)){
      const pre=findHabit(m,h.prereq);
      showToast('先完成「'+(pre?pre.name:'前置任务')+'」','🔒');
      if(mode==='child')speak('先完成'+(pre?pre.name:'前置任务')+'，再来完成'+h.name);
      return;
    }
    // 惩罚任务：打卡=做到了，不扣分；撤销不退
    if(h.points<0){
      m.checkins[today][habitId]=cur+1;
      logPoints(m,0,'做到：'+h.name+'（未扣分）',h.icon);
      showToast('做到了！没扣分','✅');
      if(mode==='child')speak('太棒了，你做到了'+h.name);
      saveData();render();
      return;
    }
    m.points+=h.points;
    // 耗时任务：打卡即结束计时，并把耗时写入积分日志（番茄任务记专注时长，不含休息）
    let durTxt='';
    if(h.trackTime){
      const active=getActiveSession(m,today,habitId);
      if(active){
        active.e=Date.now();
        if(h.pomodoro>0){
          const pomoLen=h.pomodoro*60000;
          const curMs=active.pomoStart?Math.min(active.e,active.pomoStart+pomoLen)-active.pomoStart:0;
          durTxt='（专注'+fmtDur((active.pomosDone||0)*pomoLen+curMs)+'）';
        }else{
          durTxt='（用时'+fmtDur(active.e-active.s)+'）';
        }
      }
    }
    logPoints(m,h.points,(target>1?'完成一次：':'完成习惯：')+h.name+durTxt,h.icon);
    const tBefore=countHabitTimes(m,h); // 打卡前的累计总数（打卡将使其 +1）
    m.checkins[today][habitId]=cur+1;
    const newCnt=cur+1;
    // 累计目标达成（跨越阈值的那一次，独立于当日是否达标）
    const totalHit=h.totalTargetTimes>0&&tBefore<h.totalTargetTimes&&tBefore+1>=h.totalTargetTimes;
    const msgs=['太棒了！','做得真好！','继续保持！','你真厉害！','又完成一个！'];
    const msg=msgs[Math.floor(Math.random()*msgs.length)];
    if(totalHit){
      showToast('🎉 累计 '+h.totalTargetTimes+' 次全部完成！','🏆');
      if(mode==='child')speak('太棒了，你全部完成了'+h.name+'的挑战');
      celebrate();
    }else if(newCnt>=target){
      showToast(msg,h.icon);
      if(mode==='child')speak(msg+'你完成了'+h.name);
      celebrate();
      if(h.goalDays&&countHabitDays(m,h)>=h.goalDays){
        showToast('🎉 达成目标：'+h.name+' '+h.goalDays+'天！','🏆');
        if(mode==='child')speak('太棒了，你完成了'+h.name+' '+h.goalDays+'天的挑战');
        celebrate();
      }
    }else{
      showToast(msg+'（'+newCnt+'/'+target+'）',h.icon);
      if(mode==='child')speak(msg);
    }
    checkBadges(m);
  }else{
    // ===== 撤销一次 =====
    if(cur<=0)return;
    // 级联判断：此次撤销将使任务失去「已完成」状态时（cur 达标后撤销一次），下游已完成任务需一并取消，
    // 防止出现「前置未完成但下游已完成」的矛盾（含 cur=1 清零场景）
    const willLoseDone=cur>=target;
    if(willLoseDone){
      const cascade=collectCascadeDownstream(m,h,today);
      if(cascade.length>0){
        const refund=(h.points>=0?cur*h.points:0)+cascade.reduce((s,x)=>{const xc=getCheckinCount(m,today,x.id);return s+(x.points>=0?xc*x.points:0)},0);
        openModal(`<h3>取消打卡</h3>
        <button class="close-btn" onclick="closeModal()">×</button>
        <p style="font-size:14px;color:var(--text-1);margin-bottom:8px">将取消「${h.name}」的打卡。</p>
        <p style="font-size:13px;color:var(--text-2);margin-bottom:4px">以下任务以它为前置且今日已完成，将一并取消：</p>
        <p style="font-size:13px;font-weight:600;color:var(--accent);margin-bottom:14px">${cascade.map(x=>x.icon+' '+x.name).join('、')}</p>
        <button class="btn-primary" onclick="doCascadeCancel('${h.id}')">确认取消（共退回 ${refund} 分）</button>
        <button class="btn-danger" onclick="closeModal()">不取消了</button>
      `);
        return;
      }
    }
    if(h.points<0){
      // 惩罚任务：撤销“做到了”，积分不变（打卡时本就没扣）
      if(cur<=1){delete m.checkins[today][habitId]}else{m.checkins[today][habitId]=cur-1}
      logPoints(m,0,'取消做到：'+h.name,h.icon);
      showToast('已取消','↩️');
      saveData();render();
      return;
    }
    m.points-=h.points;
    logPoints(m,-h.points,target>1?'取消一次：'+h.name:'取消打卡：'+h.name,h.icon);
    // 耗时任务：撤销打卡同时移除对应的最后一个计时会话
    if(h.trackTime){
      const ss=getSessions(m,today,habitId);
      if(ss.length>0)ss.pop();
    }
    if(cur<=1){delete m.checkins[today][habitId]}else{m.checkins[today][habitId]=cur-1}
    showToast(target>1?'已取消一次':'已取消','↩️');
  }
  saveData();render();
}
// 收集今日已完成、且直接/间接以指定任务为前置的任务（级联取消范围）
function collectCascadeDownstream(m,h,today){
  const result=[];
  const direct=m.habits.filter(x=>x.prereq===h.id&&isHabitDone(m,x,today));
  direct.forEach(x=>{
    if(!result.find(r=>r.id===x.id)){
      result.push(x);
      collectCascadeDownstream(m,x,today).forEach(y=>{
        if(!result.find(r=>r.id===y.id))result.push(y);
      });
    }
  });
  return result;
}
// 确认后执行级联取消（沿依赖链逐一取消并退回积分）
function doCascadeCancel(habitId){
  const m=getMember();if(!m)return;
  const today=todayStr();
  const h=m.habits.find(x=>x.id===habitId);if(!h)return;
  const cascade=collectCascadeDownstream(m,h,today);
  cascade.forEach(x=>{
    const xc=getCheckinCount(m,today,x.id);
    if(x.points>=0&&xc>0){m.points-=xc*x.points;logPoints(m,-xc*x.points,'级联取消：'+x.name,x.icon)}
    delete m.checkins[today][x.id];
    if(x.trackTime&&m.timeLogs&&m.timeLogs[today])delete m.timeLogs[today][x.id]; // 同步清理计时会话
  });
  const cnt=getCheckinCount(m,today,habitId);
  if(h.points>=0&&cnt>0){m.points-=cnt*h.points;logPoints(m,-cnt*h.points,'取消打卡：'+h.name,h.icon)}
  delete m.checkins[today][habitId];
  if(h.trackTime&&m.timeLogs&&m.timeLogs[today])delete m.timeLogs[today][habitId];
  saveData();closeModal();render();
  showToast('已取消（含前置链下游 '+(cascade.length+1)+' 项）','↩️');
}
function calcStreak(m){
  let streak=0;const d=new Date();
  while(true){
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const ci=m.checkins[ds];
    if(ci&&Object.keys(ci).length>0)streak++;
    else break;
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function checkBadges(m){
  const streak=calcStreak(m);
  const defs=state.badgeDefs||[];
  defs.forEach(b=>{
    if(streak>=b.days&&!m.badges.includes(b.id)){
      m.badges.push(b.id);
      showToast('解锁徽章：'+b.name,b.icon);
      if(m.mode==='child')speak('太棒了，你获得了'+b.name+'徽章');
      celebrate();
    }
  });
}
function requestReward(rewardId){
  const m=getMember();if(!m)return;
  const r=(state.rewardTemplates||[]).find(t=>t.id===rewardId);if(!r)return;
  if(m.points<r.points){showToast('积分不足','😢');return}
  if(!m.pendingRewards)m.pendingRewards=[];

  m.points-=r.points;
  logPoints(m,-r.points,'兑换奖励：'+r.name,r.icon);

  if(m.mode==='child')speak('你申请了'+r.name+'，等爸爸妈妈同意哦');
  saveData();render();
}

function onAvatarFile(input){
  const f=input.files&&input.files[0];
  if(!f)return;

function syncAvatarPreview(){
  const pv=document.getElementById('avatarPreview'),sel=document.getElementById('mAvatar'),hid=document.getElementById('mAvatarImg');
  if(!pv)return;
  if(hid&&hid.value){

function compressAvatar(file,cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      // 超大图安全处理：单边 > 4096 时分步减半降采样（移动端 canvas 尺寸限制约 4096，直接解码大图可能失败）
      let src=img,sw=img.width,sh=img.height;
      while(Math.max(sw,sh)>4096){
        const step=document.createElement('canvas');
        step.width=Math.max(1,Math.round(sw/2));
        step.height=Math.max(1,Math.round(sh/2));
        step.getContext('2d').drawImage(src,0,0,step.width,step.height);
        src=step;sw=step.width;sh=step.height;
      }
      const MAX=768; // 高清头像：手机全屏查看几乎 1:1，桌面轻微放大，存储约 40~120KB/张
      const scale=Math.min(1,MAX/Math.max(sw,sh));
      const w=Math.max(1,Math.round(sw*scale)),h=Math.max(1,Math.round(sh*scale));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(src,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.85));
    };
    img.onerror=()=>showToast('图片读取失败','❌');
    img.src=e.target.result;
  };
  reader.onerror=()=>showToast('图片读取失败','❌');
  reader.readAsDataURL(file);
}

  const inp=document.getElementById('hPoints');

  const hint=document.getElementById('prereqHint');
  const timesInp=document.getElementById('hTimes');
  const timesHint=document.getElementById('timesHint');

  const punish=parseInt(inp.value)<0;
  sel.disabled=punish;

  if(timesHint){timesHint.innerHTML=punish?'惩罚任务固定为 1 次':'大于 1 时每天需打卡多次，每次得分'}
  if(trackCb){trackCb.disabled=punish;if(punish)trackCb.checked=false}

// 频率切换联动：艾宾浩斯/目标任务隐藏不适用字段
function syncFreqFields(){
  const sel=document.getElementById('hFreq');
  if(!sel)return;
  const ebb=sel.value==='ebbinghaus';
  const goal=sel.value==='deadline';
  ['daysGroup','timesGroup','prereqGroup','goalGroup','totalGroup','trackGroup'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.style.display=(ebb||goal)?'none':'';
  });
  const hint=document.getElementById('freqHint');
  if(hint)hint.style.display=ebb?'':'none';
  const goalHint=document.getElementById('goalFreqHint');
  if(goalHint)goalHint.style.display=goal?'':'none';
  const dlGroup=document.getElementById('deadlineGroup');
  if(dlGroup)dlGroup.style.display=goal?'':'none';
  const pomoWrap=document.getElementById('hPomoWrap');
  if(pomoWrap&&(ebb||goal))pomoWrap.style.display='none';
}
function saveHabit(memberId,id){
  const m=memberId?state.members.find(x=>x.id===memberId):getMember();if(!m)return;
  const name=document.getElementById('hName').value.trim();
  if(!name){showToast('请输入名称','❌');return}
  const icon=document.getElementById('hIcon').value;
  const points=parseInt(document.getElementById('hPoints').value)||0;
  const freq=document.getElementById('hFreq').value;
  const goalRaw=document.getElementById('hGoal').value;
  const goalDays=goalRaw?parseInt(goalRaw)||0:0;
  const totalRaw=document.getElementById('hTotal').value;
  const totalTargetTimes=totalRaw?Math.max(0,parseInt(totalRaw)||0):0;
  const trackTime=points<0?false:document.getElementById('hTrack').checked;
  const pomodoro=(!trackTime||points<0)?0:(parseInt(document.getElementById('hPomo').value)||0);
  const timesRaw=document.getElementById('hTimes').value;
  const targetTimes=Math.max(1,parseInt(timesRaw)||1);
  const finalTarget=points<0?1:targetTimes;
  const prereq=document.getElementById('hPrereq').value||'';
  const days=[];
  document.querySelectorAll('[data-day]').forEach(cb=>{if(cb.checked)days.push(parseInt(cb.dataset.day))});
  // 校验：惩罚任务（负分）不能设置前置任务
  if(points<0&&prereq){showToast('惩罚任务不能设置前置任务','❌');return}
  // 校验：惩罚任务（负分）不能被其他任务设为前置
  if(points<0&&id){
    const dependents=m.habits.filter(x=>x.prereq===id);
    if(dependents.length>0){
      showToast('已有任务以它为前置，不能改为惩罚任务','❌');return;
    }
  }
  // 校验：前置任务不能造成循环依赖（A→B→A）；仅编辑已有习惯时需要校验（新增无循环可能）
  if(prereq&&id){
    let cur=prereq;
    while(cur&&cur!==id){
      const ph=findHabit(m,cur);
      cur=ph?ph.prereq:'';
    }
    if(cur===id){showToast('前置任务不能形成循环','❌');return}
  }
  if(id){
    const h=m.habits.find(x=>x.id===id);
    const patch={name,icon,points,freq,days,goalDays:goalDays||0,totalTargetTimes,trackTime,pomodoro,targetTimes:finalTarget,prereq};
    if(freq==='deadline'){
      // 目标任务：需截止日期与总次数；不适用字段强制清空
      const dlDate=document.getElementById('hDeadlineDate').value;
      const dlTimes=Math.max(1,parseInt(document.getElementById('hDeadlineTimes').value)||1);
      if(!dlDate){showToast('请选择截止日期','❌');return}
      Object.assign(patch,{deadlineDate:dlDate,deadlineTimes:dlTimes,days:[1,2,3,4,5,6,7],targetTimes:9999,trackTime:false,pomodoro:0,prereq:'',goalDays:0,totalTargetTimes:0});
    }else{
      // 从目标任务切回普通频率：清除目标字段
      Object.assign(patch,{deadlineDate:'',deadlineTimes:0});
    }
    if(freq==='ebbinghaus'){
      // 艾宾浩斯：不适用字段强制清空；编辑已有任务保留 ebbStage/ebbNext（不打断复习进度）
      Object.assign(patch,{days:[1,2,3,4,5,6,7],targetTimes:1,trackTime:false,pomodoro:0,prereq:'',goalDays:0,totalTargetTimes:0});
      if(h.ebbStage===undefined){patch.ebbStage=0;patch.ebbNext=null}
    }else if(h.ebbStage!==undefined){
      // 从艾宾浩斯切回普通频率：清除复习状态
      Object.assign(patch,{ebbStage:0,ebbNext:null});
    }
    Object.assign(h,patch);
  }else{
    const nh={id:uid(),name,icon,points,freq,days,goalDays:goalDays||0,totalTargetTimes,trackTime,pomodoro,targetTimes:finalTarget,prereq,active:true};
    if(freq==='deadline'){
      const dlDate=document.getElementById('hDeadlineDate').value;
      const dlTimes=Math.max(1,parseInt(document.getElementById('hDeadlineTimes').value)||1);
      if(!dlDate){showToast('请选择截止日期','❌');return}
      nh.deadlineDate=dlDate;nh.deadlineTimes=dlTimes;nh.days=[1,2,3,4,5,6,7];nh.targetTimes=9999;nh.trackTime=false;nh.pomodoro=0;nh.prereq='';nh.goalDays=0;nh.totalTargetTimes=0;
    }
    if(freq==='ebbinghaus'){nh.days=[1,2,3,4,5,6,7];nh.targetTimes=1;nh.trackTime=false;nh.pomodoro=0;nh.prereq='';nh.goalDays=0;nh.totalTargetTimes=0;nh.ebbStage=0;nh.ebbNext=null}
    m.habits.push(nh);
  }
  saveData();closeModal();render();
}
function deleteHabit(memberId,id){
  const m=memberId?state.members.find(x=>x.id===memberId):getMember();if(!m)return;
  m.habits=m.habits.filter(h=>h.id!==id);
  // 清理其他习惯对该习惯的前置引用
  m.habits.forEach(h=>{if(h.prereq===id)h.prereq=''});
  saveData();closeModal();render();
}

function assignTemplate(id){

  if(!mid){showToast('所有成员均已有此任务，无需下发','ℹ️');return}
  const m=state.members.find(x=>x.id===mid);if(!m)return;
  // 重复下发拦截：已有该模板下发的任务或同名任务
  if(memberHasTemplate(m,t)){
    showToast('「'+m.name+'」已有任务「'+t.name+'」，请勿重复下发','⚠️');
    return;
  }
  const nh={id:uid(),name:t.name,icon:t.icon,points:t.points,freq:t.freq,days:t.days,goalDays:t.goalDays||0,totalTargetTimes:t.totalTargetTimes||0,trackTime:!!t.trackTime,pomodoro:t.pomodoro||0,targetTimes:t.targetTimes||1,templateId:t.id,active:true};
  if(t.freq==='deadline'){nh.deadlineDate=t.deadlineDate;nh.deadlineTimes=t.deadlineTimes||1} // 目标任务继承截止设置
  if(t.freq==='ebbinghaus'){nh.ebbStage=0;nh.ebbNext=null} // 下发的记忆任务从新学开始
  m.habits.push(nh);
  saveData();closeModal();render();
  showToast('已下发给 '+m.name,'📨');
}

  openModal(`<h3>修改管理口令</h3>
    <button class="close-btn" onclick="closeModal()">×</button>
    <div class="form-group"><label>当前口令</label>
      <input type="password" id="oldPwd" placeholder="请输入当前口令"></div>
    <div class="form-group"><label>新口令</label>
      <input type="password" id="newPwd1" placeholder="请输入新口令"></div>
    <div class="form-group"><label>确认新口令</label>
      <input type="password" id="newPwd2" placeholder="再次输入新口令"></div>
    <button class="btn-primary" onclick="savePwdChange()">保存新口令</button>
  `);
}
function savePwdChange(){
  const oldPwd=document.getElementById('oldPwd').value;
  if(oldPwd!==state.adminPwd){showToast('当前口令错误','❌');return}
  const p1=document.getElementById('newPwd1').value.trim();
  const p2=document.getElementById('newPwd2').value.trim();
  if(!p1){showToast('请输入新口令','❌');return}
  if(p1!==p2){showToast('两次输入不一致','❌');return}
  state.adminPwd=p1;saveData();closeModal();render();
  showToast('口令已更新','🔒');
}

// ======================== Modal ========================
function fmtBytes(b){
  if(b>=1048576)return (b/1048576).toFixed(1)+' MB';
  if(b>=1024)return (b/1024).toFixed(1)+' KB';
  return b+' B';
}
function showStorageDetail(){
  const d=detectStorage();
  const ua=(navigator.userAgent||'').match(/Chrome\/[\d.]+|Firefox\/[\d.]+|Safari\/[\d.]+|Edg\/[\d.]+|OPR\/[\d.]+/g);
  const browser=ua?ua.join(', '):'未知浏览器';
  const html=
    '<h3>数据与存储详情</h3><button class="close-btn" onclick="closeModal()">×</button>'+
    '<div style="font-size:13px;color:var(--text-2);margin-bottom:14px">数据仅保存在本机浏览器中，不联网上传。</div>'+
    '<div class="form-group"><label>检测结果</label>'+
    '<div style="padding:12px;border-radius:8px;background:'+(d.ok?'var(--accent-lt)':'#FFF4E0')+';color:'+(d.ok?'var(--accent)':'#9A6A00')+'">'+
    (d.ok?'✅ 本地存储可用，数据可持久保存':'❌ 本地存储不可用：'+(d.note||'浏览器禁用了 localStorage'))+'</div></div>'+
    '<div class="form-group"><label>存储位置</label><div>'+(d.ok?'本机浏览器 localStorage':'内存（本次浏览有效，刷新丢失）')+'</div></div>'+
    '<div class="form-group"><label>当前占用</label><div>'+(d.ok&&d.bytes!==undefined?fmtBytes(d.bytes):'—')+'</div></div>'+
    '<div class="form-group"><label>浏览器</label><div>'+browser+'</div></div>'+
    (d.ok?'':'<div style="font-size:12px;color:#9A6A00;background:#FFF4E0;padding:10px;border-radius:8px">提示：请在浏览器设置中允许本站点存储数据，或改用 Chrome / Edge 浏览器。兼容模式下数据仅本次会话有效。</div>')+
    '<button class="btn-primary" onclick="closeModal()">知道了</button>';
  openModal(html);
}
// ======================== 数据备份与恢复 ========================
function isWeChat(){return /MicroMessenger/i.test(navigator.userAgent)}
function exportData(){
  if(!state.members||state.members.length===0){showToast('暂无数据可导出','❌');return}
  const backup={
    app:'habit-tracker',
    version:'2.2',
    exportedAt:nowStr(),
    data:state
  };
  const text=JSON.stringify(backup,null,2);
  // 微信内置浏览器不支持 a[download] 保存文件，且微信与系统浏览器 localStorage 隔离、
  // 无法跨浏览器读取数据：唯一可行方案是复制完整备份文本，粘贴到备忘录/文件传输助手保存
  if(isWeChat()){
    window._backupText=text;
    openModal(`<h3>导出备份</h3>
      <button class="close-btn" onclick="closeModal()">×</button>
        <p style="font-size:13px;color:var(--text-2);margin-bottom:10px">微信内无法直接保存文件，请复制以下完整备份文本，粘贴到微信「文件传输助手」或备忘录中保存（约 ${(text.length/1024).toFixed(1)} KB）。</p>
      <p style="font-size:12px;color:var(--text-2);margin-bottom:10px">想保存成 .json 文件？在电脑/其他浏览器打开本页面 → 管理设置 → 粘贴文本导入 → 恢复后再「导出备份」即可。</p>
      <div class="form-group" style="margin-bottom:12px">
        <button class="btn-primary" onclick="copyBackupText()">📋 一键复制备份文本</button>
      </div>
      <div class="form-group"><label>或手动选择复制（长按文本 → 全选 → 复制）</label>
        <textarea id="backupTextarea" style="width:100%;height:200px;font-size:11px;font-family:monospace;resize:vertical;white-space:pre;overflow:auto;-webkit-user-select:text;user-select:text" readonly onclick="this.select();this.setSelectionRange(0,this.value.length)">${text.replace(/</g,'&lt;')}</textarea></div>
    `);
    return;
  }
  const blob=new Blob([text],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='习惯养成备份_'+todayStr()+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},100);
  showToast('备份文件已导出','📦');
}
function copyBackupText(){
  const ta=document.getElementById('backupTextarea');
  const text=window._backupText||(ta?ta.value:'');
  if(!text){showToast('无备份内容','❌');return}
  // 优先使用弹窗中可见的 textarea 执行 execCommand('copy')，
  // 而非创建隐藏 textarea（微信 WebView 对隐藏元素 select() 可能截断）；
  // navigator.clipboard API 在某些微信版本静默截断，不作首选
  const doExec=()=>{
    if(!ta){showToast('请手动长按下方文本框选择复制','📋');return}
    ta.focus();
    ta.select();
    ta.setSelectionRange(0,ta.value.length);
    let ok=false;
    try{ok=document.execCommand('copy')}catch(e){}
    if(ok){
      showToast('已复制！请粘贴到微信「文件传输助手」保存','📋');
      ta.blur(); // 取消选中方便用户操作
    }else{
      showToast('复制失败，请长按下方文本框手动选择复制','📋');
    }
  };
  // iOS 非微信优先 clipboard API（execCommand 在 Safari 可能被禁）
  if(navigator.clipboard&&navigator.clipboard.writeText&&!isWeChat()){
    navigator.clipboard.writeText(text).then(
      ()=>showToast('已复制！请粘贴到微信「文件传输助手」保存','📋')
    ).catch(doExec);
  }else{doExec()}
}
function handleImportFile(input){
  const file=input.files&&input.files[0];
  if(!file){return}
  const reader=new FileReader();
  reader.onload=e=>{
    let backup;
    try{backup=JSON.parse(e.target.result)}
    catch(err){showToast('文件格式错误，导入失败','❌');return}
    showImportConfirm(backup);
  };
  reader.onerror=()=>{showToast('读取文件失败','❌')};
  reader.readAsText(file,'utf-8');
  input.value=''; // 允许重复选择同一文件
}
// 粘贴文本导入：微信内无法直接下载文件，复制导出文本后可粘贴恢复
function openImportText(){
  openModal('<h3>粘贴备份文本</h3><button class="close-btn" onclick="closeModal()">×</button>'
    +'<div style="font-size:13px;color:var(--text-2);margin-bottom:12px">将「导出备份 → 一键复制」得到的完整 JSON 文本粘贴到下方，用于恢复数据（适合微信内备份的文本跨浏览器恢复）。</div>'
    +'<div class="form-group"><textarea id="importTextarea" placeholder="在此粘贴备份 JSON 文本…" style="width:100%;height:180px;font-size:11px;font-family:monospace;resize:vertical;white-space:pre;overflow:auto;-webkit-user-select:text;user-select:text"></textarea></div>'
    +'<button class="btn-primary" onclick="parseBackupText()">下一步</button>'
    +'<button class="btn-danger" onclick="closeModal()">取消</button>');
}
function parseBackupText(){
  const ta=document.getElementById('importTextarea');
  const text=ta?ta.value.trim():'';
  if(!text){showToast('请先粘贴备份文本','❌');return}
  let backup;
  try{backup=JSON.parse(text)}
  catch(err){showToast('文本格式错误，导入失败','❌');return}
  showImportConfirm(backup);
}
function showImportConfirm(backup){
  if(!backup||backup.app!=='habit-tracker'||!backup.data||!Array.isArray(backup.data.members)){
    showToast('不是有效的备份，导入失败','❌');return;
  }
  const d=backup.data;
  const memberNames=d.members.map(m=>m.name).join('、');
  const totalHabits=d.members.reduce((s,m)=>s+(m.habits?m.habits.length:0),0);
  // 二次确认
  openModal('<h3>导入备份确认</h3><button class="close-btn" onclick="closeModal()">×</button>'
    +'<div style="font-size:13px;color:var(--text-2);margin-bottom:14px">导入后<b style="color:#c33">将覆盖当前全部数据</b>（成员、习惯、积分、打卡记录），请确认备份无误。</div>'
    +'<div class="form-group"><label>备份时间</label><div>'+(backup.exportedAt||'—')+'</div></div>'
    +'<div class="form-group"><label>成员</label><div>'+memberNames+'（共 '+d.members.length+' 人）</div></div>'
    +'<div class="form-group"><label>任务数</label><div>共 '+totalHabits+' 个习惯任务</div></div>'
    +'<button class="btn-primary" onclick="confirmImport()">确认导入</button>'
    +'<button class="btn-danger" onclick="closeModal()">取消</button>');
  window.__pendingImport=d;
}
function confirmImport(){
  const d=window.__pendingImport;
  if(!d){closeModal();return}
  state=d;
  if(!state.currentMemberId&&state.members[0])state.currentMemberId=state.members[0].id;
  if(!state.currentTab)state.currentTab='habits';
  if(!state.mineView)state.mineView='main';
  state.adminUnlocked=false; // 导入恢复后需重新输入口令，防误操作
  saveData();closeModal();render();
  window.__pendingImport=null;
  showToast('数据已恢复','✅');
}
function openModal(html){
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}
document.getElementById('modalOverlay').addEventListener('click',e=>{
  if(e.target.id==='modalOverlay')closeModal();
});

// 导入文件选择事件（事件委托，因 importFile 是动态渲染的）
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='importFile')handleImportFile(e.target);
});

detectStorage();      // 先检测浏览器存储兼容性
initState();
settlePunishments();  // 结算昨日未做到的惩罚任务（自动扣分）
render();
applyStorageBanner(); // 存储不可用时显示警示横幅

// PWA Service Worker — 注册离线缓存
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/helper/sw.js').catch(function(){});
}
